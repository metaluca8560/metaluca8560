<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>루카 LUCA — 디지털 명함</title>
  <meta name="description" content="디지털다락방 루카 — AI를 가장 쉽게 현장에 적용시키는 교육 파트너. 연락처와 채널을 한 장에." />
  <meta property="og:title" content="루카 LUCA — 디지털 명함" />
  <meta property="og:description" content="생성형 AI 교육 · Canva 클래스 · AI 자동화 구축" />
  <meta property="og:type" content="profile" />
  <meta property="og:url" content="https://luca-darakbang.netlify.app/card.html" />
  <meta property="og:image" content="https://luca-darakbang.netlify.app/og-image.jpg?v=2" />
  <link rel="preconnect" href="https://fastly.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://fastly.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <style>
    /* 색은 메인 랜딩(styles.css)과 같은 퍼플 톤 */
    :root {
      --bg: #faf9f6;
      --surface: #ffffff;
      --text: #221e33;
      --muted: #6f6a85;
      --line: #e8e4f5;
      --purple: #7c3aed;
      --purple-tint: #f3eeff;
      --grad: linear-gradient(115deg, #7c3aed, #a78bfa);
      --shadow: 0 10px 34px rgba(60, 40, 120, 0.09);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #100c1c;
        --surface: #1b1630;
        --text: #efeaff;
        --muted: #a29cbd;
        --line: #2d2548;
        --purple: #b9a7ff;
        --purple-tint: #261e44;
        --shadow: 0 10px 34px rgba(0, 0, 0, 0.4);
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: radial-gradient(60% 35% at 50% 0%, rgba(167, 139, 250, 0.2), transparent 70%), var(--bg);
      color: var(--text);
      line-height: 1.6;
      word-break: keep-all;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }
    a { color: inherit; text-decoration: none; }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 36px 24px 28px;
      text-align: center;
      align-self: flex-start;
    }
    .avatar {
      width: 104px; height: 104px;
      margin: 0 auto 16px;
      border-radius: 50%;
      padding: 3px;
      background: var(--grad);
    }
    .avatar img {
      width: 100%; height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      border: 3px solid var(--surface);
    }
    .house { font-size: 13px; color: var(--purple); font-weight: 600; letter-spacing: 0.02em; }
    h1 { font-size: 26px; margin: 2px 0 6px; }
    .role { color: var(--muted); font-size: 15px; }

    .tags {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 6px;
      margin: 18px 0 22px;
    }
    .tags span {
      font-size: 12.5px;
      background: var(--purple-tint);
      color: var(--purple);
      padding: 4px 10px;
      border-radius: 999px;
    }

    .btn {
      display: block;
      padding: 14px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 15px;
    }
    .btn-primary { background: var(--grad); color: #fff; }
    .btn-ghost { border: 1px solid var(--line); margin-top: 8px; cursor: pointer; background: none; width: 100%; font: inherit; font-weight: 700; color: var(--text); }

    .links {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 22px;
    }
    .links a {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 8px;
      font-size: 14px;
      font-weight: 600;
      transition: border-color 0.15s, transform 0.15s;
    }
    .links a:hover { border-color: var(--purple); transform: translateY(-1px); }

    .foot { margin-top: 22px; font-size: 13px; color: var(--muted); }
    .foot a { color: var(--purple); font-weight: 600; }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar"><img src="profile.jpg" alt="루카 프로필 사진" /></div>
    <p class="house">디지털다락방</p>
    <h1>루카 LUCA</h1>
    <p class="role">AI를 가장 쉽게 현장에 적용시키는 교육 파트너</p>

    <div class="tags">
      <span>생성형 AI 교육</span>
      <span>Canva 클래스</span>
      <span>AI 자동화 구축</span>
    </div>

    <a class="btn btn-primary" href="mailto:atlia0318@gmail.com?subject=%5B%EB%AC%B8%EC%9D%98%5D">📩 이메일로 문의하기</a>
    <button class="btn btn-ghost" id="shareBtn" type="button">🔗 명함 링크 공유</button>

    <nav class="links" aria-label="채널">
      <a href="https://www.instagram.com/metaluca2750" target="_blank" rel="noopener">📸 인스타그램</a>
      <a href="https://youtube.com/@metaluca8563" target="_blank" rel="noopener">▶️ 유튜브</a>
      <a href="https://brunch.co.kr/@metaluca8560" target="_blank" rel="noopener">✍️ 브런치</a>
      <a href="https://naver.me/FLEwyESn" target="_blank" rel="noopener">📝 블로그</a>
      <a href="https://kmong.com/self-marketing/803533/YNgTd87HX2" target="_blank" rel="noopener">📖 전자책</a>
      <a href="https://github.com/metaluca8560" target="_blank" rel="noopener">💻 GitHub</a>
    </nav>

    <p class="foot">더 알아보기 → <a href="./">디지털다락방 홈</a></p>
  </main>

  <script>
    // 휴대폰에선 공유 창을 띄우고, 지원하지 않으면 주소를 복사한다
    document.getElementById('shareBtn').addEventListener('click', async function () {
      var data = { title: '루카 LUCA — 디지털 명함', url: location.href }
      try {
        if (navigator.share) { await navigator.share(data); return }
        await navigator.clipboard.writeText(location.href)
        this.textContent = '✅ 링크를 복사했어요'
      } catch (e) {
        if (e && e.name === 'AbortError') return
        this.textContent = '주소창의 링크를 복사해 주세요'
      }
    })
  </script>
</body>
</html>
