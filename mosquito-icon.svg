<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="모기 퇴치기 아이콘">
  <defs>
    <linearGradient id="mosGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a3e635"/>
      <stop offset="0.6" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <radialGradient id="mosCore" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#0e2414"/>
      <stop offset="1" stop-color="#051008"/>
    </radialGradient>
    <filter id="mosGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="48" cy="48" r="42" fill="url(#mosCore)"/>
  <circle cx="48" cy="48" r="42" fill="none" stroke="url(#mosGrad)" stroke-width="3.5" filter="url(#mosGlow)"/>
  <ellipse cx="48" cy="48" rx="41" ry="14" fill="none" stroke="url(#mosGrad)" stroke-width="2" opacity="0.5" transform="rotate(-24 48 48)"/>
  <!-- 초음파 -->
  <g fill="none" stroke="url(#mosGrad)" stroke-width="5.5" stroke-linecap="round" filter="url(#mosGlow)">
    <path d="M52 36 a17 17 0 0 1 0 24"/>
    <path d="M61 29 a28 28 0 0 1 0 38"/>
  </g>
  <circle cx="36" cy="48" r="7" fill="url(#mosGrad)" filter="url(#mosGlow)"/>
</svg>
