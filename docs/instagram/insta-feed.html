<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>북트리 페스티벌 — 인스타그램 피드</title>
<style>
  :root{
    --night:#0d1626; --night-2:#16233a; --night-3:#1d2d49;
    --lamp:#ffc65c; --leaf:#79d18b; --coral:#ff7a6e;
    --paper:#f3ecdd; --muted:#93a3bd; --line:rgba(243,236,221,.16);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:1080px; height:1080px; overflow:hidden; }
  body{
    font-family:Pretendard,sans-serif;
    background:
      radial-gradient(130% 60% at 50% 0%, #1a2b47 0%, var(--night) 60%),
      var(--night);
    color:var(--paper);
    position:relative;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background-image:
      radial-gradient(2px 2px at 10% 7%, rgba(243,236,221,.6) 50%, transparent 51%),
      radial-gradient(1.6px 1.6px at 85% 5%, rgba(243,236,221,.45) 50%, transparent 51%),
      radial-gradient(2.2px 2.2px at 70% 12%, rgba(255,198,92,.55) 50%, transparent 51%),
      radial-gradient(1.6px 1.6px at 28% 16%, rgba(243,236,221,.4) 50%, transparent 51%),
      radial-gradient(2px 2px at 93% 21%, rgba(243,236,221,.45) 50%, transparent 51%),
      radial-gradient(1.6px 1.6px at 6% 26%, rgba(255,198,92,.45) 50%, transparent 51%),
      radial-gradient(1.6px 1.6px at 55% 8%, rgba(243,236,221,.35) 50%, transparent 51%);
  }
  .sheet{ position:absolute; inset:0; padding:48px 64px 48px; display:flex; flex-direction:column; }

  .topbar{
    display:flex; justify-content:space-between; align-items:center;
    font-size:21px; letter-spacing:.24em; color:var(--muted); font-weight:700;
    border-bottom:2px solid var(--line); padding-bottom:18px;
  }
  .topbar .free{
    color:var(--night); background:var(--lamp);
    padding:7px 20px; border-radius:999px; letter-spacing:.14em; font-weight:800; font-size:19px;
  }

  .main{ flex:1; display:flex; align-items:center; gap:48px; margin-top:4px; }

  /* tree column */
  .tree-col{ position:relative; flex:none; width:400px; display:flex; flex-direction:column; align-items:center; }
  .halo{
    position:absolute; top:-20px; left:50%; transform:translateX(-50%);
    width:460px; height:430px; border-radius:50%;
    background:radial-gradient(closest-side, rgba(255,198,92,.18), transparent 72%);
  }
  .star{
    color:var(--lamp); font-size:44px; line-height:1; margin-bottom:12px;
    text-shadow:0 0 22px rgba(255,198,92,.95), 0 0 60px rgba(255,198,92,.5);
  }
  .tree{ display:flex; flex-direction:column; align-items:center; gap:8px; position:relative; }
  .row{ display:flex; gap:8px; align-items:flex-end; }
  .bk{ height:25px; border-radius:4px; box-shadow:inset 0 -5px 0 rgba(0,0,0,.28); }
  .bk.g{ background:var(--leaf); } .bk.y{ background:var(--lamp); }
  .bk.c{ background:var(--coral); } .bk.p{ background:var(--paper); }
  .bk.b{ background:#4f7fca; }
  .bk.t1{ transform:rotate(-2.5deg); } .bk.t2{ transform:rotate(2deg); }
  .trunk{ display:flex; flex-direction:column; align-items:center; gap:6px; margin-top:10px; }
  .trunk .bk{ height:20px; background:#8a6a44; box-shadow:inset 0 -5px 0 rgba(0,0,0,.3); }
  .lights{ position:absolute; inset:0; }
  .lt{
    position:absolute; width:10px; height:10px; border-radius:50%;
    background:var(--lamp); box-shadow:0 0 14px 4px rgba(255,198,92,.85);
  }

  /* title column */
  .title-col{ flex:1; }
  .kicker{
    display:inline-block; font-size:26px; font-weight:800; color:var(--coral);
    margin-bottom:14px; letter-spacing:.04em;
  }
  h1{
    font-family:"Pretendard Black",Pretendard,sans-serif;
    font-size:132px; line-height:.9; font-weight:900; letter-spacing:-.035em;
  }
  h1 .tw{ color:var(--lamp); text-shadow:0 0 44px rgba(255,198,92,.4); }
  .sub{ margin-top:18px; font-size:38px; font-weight:800; letter-spacing:-.01em; }
  .slogan{ margin-top:10px; font-size:22px; color:var(--muted); font-weight:500; line-height:1.5; }

  /* meta strip */
  .meta{
    display:grid; grid-template-columns:1fr 1fr 1.2fr;
    border-block:2px solid var(--line); margin-top:8px;
  }
  .meta > div{ padding:18px 12px; text-align:center; }
  .meta > div + div{ border-left:2px solid var(--line); }
  .meta .lb{ font-size:16px; letter-spacing:.26em; color:var(--muted); font-weight:700; margin-bottom:8px; }
  .meta .vl{ font-size:30px; font-weight:800; font-variant-numeric:tabular-nums; }
  .meta .vl small{ font-size:20px; font-weight:600; color:var(--muted); }

  /* bottom */
  .bottom{ display:flex; align-items:center; gap:32px; margin-top:22px; }
  .glow{
    flex:none; display:flex; align-items:center; gap:20px;
    background:var(--night-3); border:2px solid rgba(255,198,92,.4);
    border-radius:14px; padding:16px 28px;
  }
  .glow .t{ font-size:40px; font-weight:900; color:var(--lamp);
    text-shadow:0 0 26px rgba(255,198,92,.45); font-variant-numeric:tabular-nums; }
  .glow .n{ font-size:24px; font-weight:800; line-height:1.35; }
  .glow .n small{ display:block; font-size:17px; font-weight:500; color:var(--muted); }
  .tags{ font-size:23px; font-weight:700; color:var(--leaf); line-height:1.65; }
</style>
</head>
<body>
<div class="sheet">

  <div class="topbar">
    <span>청소년차오름센터 · 청소년 북 페스티벌</span>
    <span class="free">입장 무료</span>
  </div>

  <div class="main">
    <div class="tree-col">
      <div class="halo"></div>
      <div class="star">✦</div>
      <div class="tree">
        <div class="row"><span class="bk y t1" style="width:56px"></span></div>
        <div class="row"><span class="bk g" style="width:50px"></span><span class="bk c t2" style="width:44px"></span></div>
        <div class="row"><span class="bk p t1" style="width:46px"></span><span class="bk b" style="width:60px"></span><span class="bk g t2" style="width:40px"></span></div>
        <div class="row"><span class="bk c" style="width:54px"></span><span class="bk y t1" style="width:44px"></span><span class="bk p" style="width:50px"></span><span class="bk g t2" style="width:46px"></span></div>
        <div class="row"><span class="bk b t2" style="width:50px"></span><span class="bk g" style="width:56px"></span><span class="bk c t1" style="width:40px"></span><span class="bk y" style="width:50px"></span><span class="bk p t2" style="width:44px"></span></div>
        <div class="row"><span class="bk g t1" style="width:46px"></span><span class="bk p" style="width:54px"></span><span class="bk y t2" style="width:46px"></span><span class="bk b" style="width:44px"></span><span class="bk c t1" style="width:50px"></span><span class="bk g" style="width:46px"></span></div>
        <div class="trunk">
          <span class="bk" style="width:56px"></span>
          <span class="bk" style="width:66px"></span>
        </div>
        <div class="lights">
          <span class="lt" style="top:8%;  left:46%"></span>
          <span class="lt" style="top:22%; left:30%"></span>
          <span class="lt" style="top:26%; left:66%"></span>
          <span class="lt" style="top:42%; left:18%"></span>
          <span class="lt" style="top:46%; left:52%"></span>
          <span class="lt" style="top:50%; left:80%"></span>
          <span class="lt" style="top:66%; left:8%"></span>
          <span class="lt" style="top:70%; left:38%"></span>
          <span class="lt" style="top:64%; left:64%"></span>
          <span class="lt" style="top:74%; left:90%"></span>
        </div>
      </div>
    </div>

    <div class="title-col">
      <span class="kicker">책 읽으러 오지 마, 놀러 와</span>
      <h1>BOOK<br><span class="tw">TREE</span></h1>
      <div class="sub">북트리 페스티벌</div>
      <div class="slogan">페이지를 넘겨, 세계가 열려<br>미션 여권 들고 5개 존 격파, 한정판 굿즈까지</div>
    </div>
  </div>

  <div class="meta">
    <div>
      <div class="lb">DATE</div>
      <div class="vl">2026. 10. 24 <small>SAT</small></div>
    </div>
    <div>
      <div class="lb">TIME</div>
      <div class="vl">13:00 – 20:30</div>
    </div>
    <div>
      <div class="lb">PLACE</div>
      <div class="vl">청소년차오름센터 광장</div>
    </div>
  </div>

  <div class="bottom">
    <div class="glow">
      <span class="t">19:30</span>
      <span class="n">북트리 점등식<small>1,500권의 트리에 불이 켜지는 순간</small></span>
    </div>
    <div>
      <div class="tags">#북트리페스티벌 #텍스트힙<br>#내인생책3초소개</div>
      <div style="font-size:17px; color:var(--muted); font-weight:600; margin-top:8px;">주최 청소년차오름센터</div>
    </div>
  </div>

</div>
</body>
</html>
