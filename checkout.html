<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1120">
<title>💳 클로페이 — 충전 결제</title>
<link rel="icon" type="image/svg+xml" href="clopay-logo.svg">
<style>
  :root {
    --bg: #0b1120; --card: #131c31; --card2: #1a2540;
    --accent: #60a5fa; --accent2: #34d399; --danger: #f87171; --warn: #fbbf24;
    --text: #e2e8f0; --muted: #94a3b8; --border: rgba(148, 163, 184, 0.15);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Noto Sans KR", sans-serif;
    background: var(--bg); color: var(--text); min-height: 100dvh;
    background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(96,165,250,0.10), transparent);
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 430px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; gap: 10px; padding: 4px 4px 16px; }
  header a { text-decoration: none; color: var(--muted); font-size: 1.4rem; line-height: 1; padding: 4px 8px 4px 0; }
  header h1 { font-size: 1.1rem; font-weight: 800; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 20px; margin-bottom: 14px; }
  .amount-line { display: flex; justify-content: space-between; align-items: baseline; }
  .amount-line .label { color: var(--muted); font-size: 0.85rem; font-weight: 700; }
  .amount-line .value { font-size: 1.5rem; font-weight: 800; }
  .test-badge {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 10px;
    font-size: 0.72rem; font-weight: 700; color: var(--warn);
    border: 1px solid rgba(251,191,36,0.4); border-radius: 999px; padding: 4px 10px;
  }
  /* 위젯 영역은 밝은 배경 위에서 잘 보이도록 */
  .widget-card { background: #fff; border-radius: 20px; overflow: hidden; margin-bottom: 14px; }
  #payment-method { min-height: 100px; }
  .btn {
    width: 100%; border: none; border-radius: 16px; padding: 16px;
    font-size: 1rem; font-weight: 800; cursor: pointer; font-family: inherit;
    background: linear-gradient(135deg, var(--accent), #3b82f6); color: #fff;
    transition: transform 0.1s, opacity 0.2s;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.4; }
  .status { text-align: center; color: var(--muted); font-size: 0.8rem; padding: 20px 10px; line-height: 1.6; }
  .status.error { color: var(--danger); }
  .status a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a href="pay-app.html" aria-label="뒤로">‹</a>
    <h1>지갑 충전 결제</h1>
  </header>

  <div class="card">
    <div class="amount-line">
      <span class="label">충전 금액</span>
      <span class="value" id="amountText">-</span>
    </div>
    <span class="test-badge" id="modeBadge" hidden>🧪 테스트 모드 — 실제 돈이 결제되지 않아요</span>
  </div>

  <div class="widget-card">
    <div id="payment-method"><div class="status" id="loadStatus" style="color:#64748b;">결제수단을 불러오는 중…</div></div>
    <div id="agreement"></div>
  </div>

  <button class="btn" id="payButton" disabled>결제하기</button>
  <p class="status" id="errorBox" hidden></p>
</div>

<script src="pay-config.js"></script>
<script src="https://js.tosspayments.com/v2/standard"></script>
<script>
"use strict";
const CFG = window.CLOPAY_CONFIG || {};
const params = new URLSearchParams(location.search);
const amount = parseInt(params.get("amount") || "0", 10);
const fmt = (n) => n.toLocaleString("ko-KR");

const errorBox = document.getElementById("errorBox");
function showError(msg, isHtml) {
  errorBox.hidden = false;
  errorBox.classList.add("error");
  if (isHtml) errorBox.innerHTML = msg; else errorBox.textContent = msg;
}

(async function main() {
  if (!(amount >= 1000 && amount <= 10000000)) {
    document.getElementById("amountText").textContent = "금액 오류";
    document.getElementById("loadStatus").textContent = "";
    return showError("충전 금액이 올바르지 않아요 (1,000원 ~ 10,000,000원). 앱에서 다시 시도해 주세요.");
  }
  document.getElementById("amountText").textContent = fmt(amount) + " 원";

  if (!CFG.clientKey) {
    return showError("pay-config.js에 clientKey가 설정되지 않았어요.");
  }
  const isTest = CFG.clientKey.startsWith("test_");
  document.getElementById("modeBadge").hidden = !isTest;

  if (typeof TossPayments === "undefined") {
    document.getElementById("loadStatus").textContent = "";
    return showError(
      "토스페이먼츠 결제 모듈을 불러오지 못했어요.<br>네트워크 연결을 확인하고 새로고침해 주세요.<br><a href='pay-app.html'>← 앱으로 돌아가기</a>", true);
  }

  try {
    // 브라우저별 고정 고객 키 (2~50자, 영문/숫자/-_=.@)
    let customerKey = localStorage.getItem("clopay_customer_key");
    if (!customerKey) {
      customerKey = "cust_" + Math.random().toString(36).slice(2, 12) + Date.now().toString(36);
      localStorage.setItem("clopay_customer_key", customerKey);
    }

    const tossPayments = TossPayments(CFG.clientKey);
    const widgets = tossPayments.widgets({ customerKey });
    await widgets.setAmount({ currency: "KRW", value: amount });
    document.getElementById("loadStatus").remove();
    await Promise.all([
      widgets.renderPaymentMethods({ selector: "#payment-method", variantKey: "DEFAULT" }),
      widgets.renderAgreement({ selector: "#agreement", variantKey: "AGREEMENT" }),
    ]);

    const btn = document.getElementById("payButton");
    btn.disabled = false;
    btn.textContent = fmt(amount) + "원 결제하기";
    btn.addEventListener("click", async () => {
      btn.disabled = true;
      const orderId = "clopay_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 8);
      // 클라우드 지갑 사용 중이면 어느 계정에 충전할지 함께 보관
      let user = null;
      try { user = JSON.parse(localStorage.getItem("clopay_user")); } catch (e) {}
      // 성공 페이지에서 금액 위변조를 대조할 수 있도록 주문 정보를 보관
      localStorage.setItem("clopay_pending", JSON.stringify({
        orderId, amount, at: Date.now(), userId: (user && user.id) || null,
      }));
      try {
        await widgets.requestPayment({
          orderId,
          orderName: "클로페이 지갑 충전 " + fmt(amount) + "원",
          successUrl: location.origin + location.pathname.replace(/[^/]*$/, "") + "pay-success.html",
          failUrl: location.origin + location.pathname.replace(/[^/]*$/, "") + "pay-fail.html",
        });
      } catch (e) {
        // 사용자가 결제창을 닫은 경우 등
        btn.disabled = false;
        if (e && e.code !== "USER_CANCEL") showError(e.message || "결제 요청 중 오류가 발생했어요.");
      }
    });
  } catch (e) {
    // 원인 추적용으로 토스 SDK 에러 코드를 함께 표시
    console.error("결제위젯 초기화 실패:", e);
    const detail = (e && e.code ? "[" + e.code + "] " : "") + ((e && e.message) || e);
    showError("결제위젯 초기화 실패: " + detail);
  }
})();
</script>
</body>
</html>
