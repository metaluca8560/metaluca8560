<!-- IT 뉴스 다이제스트 이메일 HTML 템플릿 -->
<!-- 사용: buildEmailHTML(newsJSON) 함수에서 생성 -->
<!--
newsJSON 구조:
{
  "date": "YYYY-MM-DD",
  "ai_news": [{"title":"...","summary":"...","source":"..."}],
  "tech_news": [{"title":"...","summary":"...","source":"..."}]
}
-->

<div style="font-family:sans-serif;max-width:600px;margin:0 auto;color:#333">

  <!-- 헤더 -->
  <div style="background:#1a1a1a;padding:20px 24px;border-radius:8px 8px 0 0">
    <p style="color:#EF9F27;font-family:monospace;font-size:11px;margin:0 0 4px">DAILY IT NEWS DIGEST</p>
    <h1 style="color:#fff;font-size:20px;margin:0;font-weight:500">📰 IT 뉴스 요약</h1>
    <p style="color:#888;font-size:13px;margin:4px 0 0">{{DATE}}</p>
  </div>

  <!-- 본문 -->
  <div style="border:1px solid #e5e5e5;border-top:none;padding:20px 24px;border-radius:0 0 8px 8px">

    <!-- AI 뉴스 섹션 -->
    <h2 style="font-size:14px;font-weight:600;color:#3C3489;border-bottom:1px solid #eee;padding-bottom:8px">AI 뉴스</h2>

    <!-- 아이템 반복 (ai_news) -->
    <div style="margin-bottom:14px">
      <p style="font-size:14px;font-weight:600;margin:0 0 4px">1. {{ai_news[i].title}}</p>
      <p style="font-size:13px;color:#555;margin:0 0 4px;line-height:1.6">{{ai_news[i].summary}}</p>
      <p style="font-size:11px;color:#999;margin:0;font-family:monospace">출처: {{ai_news[i].source}}</p>
    </div>

    <!-- 테크 뉴스 섹션 -->
    <h2 style="font-size:14px;font-weight:600;color:#0F6E56;border-bottom:1px solid #eee;padding-bottom:8px;margin-top:20px">테크 뉴스</h2>

    <!-- 아이템 반복 (tech_news) -->
    <div style="margin-bottom:14px">
      <p style="font-size:14px;font-weight:600;margin:0 0 4px">1. {{tech_news[i].title}}</p>
      <p style="font-size:13px;color:#555;margin:0 0 4px;line-height:1.6">{{tech_news[i].summary}}</p>
      <p style="font-size:11px;color:#999;margin:0;font-family:monospace">출처: {{tech_news[i].source}}</p>
    </div>

    <!-- 푸터 -->
    <div style="margin-top:24px;padding-top:16px;border-top:1px solid #eee">
      <p style="font-size:11px;color:#bbb;margin:0;font-family:monospace">
        Generated by Clo · infoloomia Daily Digest
      </p>
    </div>

  </div>
</div>
