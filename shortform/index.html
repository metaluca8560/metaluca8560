<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>숏폼 트렌드 통합 대시보드 — AI 트렌드 다락방</title>
  <meta name="description" content="릴스·쇼츠 성과 데이터를 입력하면 AI가 진단하고 다음 영상의 개선 포인트를 알려드려요." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="숏폼 성과 분석기 📱" />
  <meta property="og:description" content="릴스·쇼츠 조회수 왜 안 나올까? 성과 데이터를 넣으면 AI가 진단하고 개선 포인트를 알려드려요" />
  <meta property="og:image" content="https://metaluca8560.vercel.app/shortform-lab-icon.png" />
  <meta property="og:url" content="https://metaluca8560.vercel.app/shortform/" />
  <link rel="icon" type="image/svg+xml" href="../logo.svg" />
  <link rel="preconnect" href="https://fastly.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://fastly.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f; --surface: #13131a; --surface2: #1c1c28; --border: #2a2a3a;
      --text: #f0f0f5; --muted: #888; --radius: 14px;
      --primary: #ff0000; --secondary: #ff9000;
      --primary-glow: rgba(255,0,0,0.15);
    }
    body[data-platform="youtube"] { --primary: #ff0000; --secondary: #ff9000; --primary-glow: rgba(255,0,0,0.15); }
    body[data-platform="tiktok"]  { --primary: #25f4ee; --secondary: #fe2c55; --primary-glow: rgba(37,244,238,0.12); }
    body[data-platform="reels"]   { --primary: #c13584; --secondary: #f77737; --primary-glow: rgba(193,53,132,0.15); }
    body { background: var(--bg); color: var(--text); font-family: 'Pretendard', -apple-system, sans-serif; min-height: 100vh; line-height: 1.6; }
    .header { padding: 20px 24px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); }
    .header a { text-decoration: none; color: var(--muted); font-size: 14px; }
    .header a:hover { color: var(--text); }
    .header-logo { width: 32px; height: 32px; }
    .header-title { font-size: 18px; font-weight: 700; background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header-sep { color: var(--border); margin: 0 4px; }
    .main { max-width: 900px; margin: 0 auto; padding: 40px 20px 80px; }
    .hero { text-align: center; margin-bottom: 32px; }
    .hero h1 { font-size: clamp(28px, 5vw, 44px); font-weight: 800; letter-spacing: -1px; line-height: 1.2; }
    .hero h1 span { background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .hero p { color: var(--muted); margin-top: 12px; font-size: 16px; }
    .tabs { display: flex; gap: 10px; justify-content: center; margin-bottom: 32px; flex-wrap: wrap; }
    .tab { display: inline-flex; align-items: center; gap: 8px; padding: 12px 22px; border-radius: 30px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
    .tab:hover { color: var(--text); }
    .tab.active { border-color: var(--primary); color: var(--text); background: var(--primary-glow); box-shadow: 0 0 0 3px var(--primary-glow); }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; margin-bottom: 20px; }
    .card-title { font-size: 15px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 20px; }
    .card-desc { color: var(--muted); font-size: 13px; margin: -12px 0 20px; }
    .field { margin-bottom: 18px; }
    label { display: block; font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
    label .hint { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 6px; }
    input, textarea, select { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; color: var(--text); font-family: inherit; font-size: 15px; outline: none; transition: border-color 0.2s; }
    input:focus, textarea:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
    textarea { resize: vertical; min-height: 90px; }
    select option { background: var(--surface2); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .grid-2 .field, .grid-3 .field { margin-bottom: 0; }
    .metric-wrap { position: relative; }
    .metric-wrap input { padding-right: 40px; }
    .metric-unit { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 13px; pointer-events: none; }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 14px 28px; border: none; border-radius: 10px; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
    .btn-primary { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; width: 100%; justify-content: center; font-size: 16px; }
    .btn-primary:hover:not(:disabled) { box-shadow: 0 8px 24px var(--primary-glow); transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); font-size: 13px; padding: 8px 14px; }
    .btn-secondary:hover { color: var(--text); border-color: var(--muted); }
    .loading { display: none; text-align: center; padding: 40px; }
    .loading.show { display: block; }
    .spinner { width: 48px; height: 48px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading p { color: var(--muted); font-size: 14px; }
    .result { display: none; }
    .result.show { display: block; }
    .score-bar { display: flex; align-items: center; gap: 20px; padding: 24px; background: var(--surface2); border-radius: 12px; margin-bottom: 24px; }
    .score-circle { width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 22px; font-weight: 900; border: 3px solid; }
    .score-circle.great { border-color: #4ade80; color: #4ade80; background: rgba(74,222,128,0.1); }
    .score-circle.good  { border-color: var(--secondary); color: var(--secondary); background: var(--primary-glow); }
    .score-circle.ok    { border-color: #facc15; color: #facc15; background: rgba(250,204,21,0.1); }
    .score-circle.low   { border-color: #f87171; color: #f87171; background: rgba(248,113,113,0.1); }
    .score-info h3 { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
    .score-info p  { color: var(--muted); font-size: 14px; }
    .section-label { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin: 28px 0 14px; display: flex; align-items: center; gap: 8px; }
    .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .insight-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .insight-item { background: var(--surface2); border-radius: 10px; padding: 16px; }
    .insight-item .label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
    .insight-item .value { font-size: 22px; font-weight: 800; }
    .insight-item .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .analysis-content { background: var(--surface2); border-radius: 12px; padding: 20px; font-size: 15px; line-height: 1.8; white-space: pre-wrap; }
    .analysis-content h3 { font-size: 15px; font-weight: 700; color: var(--secondary); margin: 18px 0 8px; }
    .analysis-content h3:first-child { margin-top: 0; }
    .analysis-content ul { padding-left: 20px; }
    .analysis-content li { margin-bottom: 6px; }
    .analysis-content strong { color: var(--text); }
    .action-row { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
    .history-list { display: flex; flex-direction: column; gap: 10px; }
    .history-item { display: flex; align-items: center; gap: 14px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; cursor: pointer; transition: border-color 0.2s; }
    .history-item:hover { border-color: var(--primary); }
    .history-badge { flex-shrink: 0; font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border); color: var(--muted); text-transform: uppercase; }
    .history-badge.youtube { color: #ff6666; border-color: rgba(255,0,0,0.4); }
    .history-badge.tiktok  { color: #25f4ee; border-color: rgba(37,244,238,0.4); }
    .history-badge.reels   { color: #e1699e; border-color: rgba(193,53,132,0.5); }
    .history-info { flex: 1; min-width: 0; }
    .history-info .t { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .history-info .m { font-size: 12px; color: var(--muted); }
    .history-del { flex-shrink: 0; background: none; border: none; color: var(--muted); font-size: 16px; cursor: pointer; padding: 4px 8px; }
    .history-del:hover { color: #f87171; }
    .history-empty { color: var(--muted); font-size: 14px; text-align: center; padding: 20px 0; }
    @media (max-width: 600px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } .grid-2 .field, .grid-3 .field { margin-bottom: 18px; } .insight-grid { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body data-platform="youtube">
<header class="header">
  <img src="../logo.svg" class="header-logo" alt="logo" />
  <a href="../index.html">AI 트렌드 다락방</a>
  <span class="header-sep">›</span>
  <span class="header-title">숏폼 트렌드 통합 대시보드</span>
</header>
<main class="main">
  <div class="hero">
    <h1>숏폼 트렌드<br><span>통합 AI 대시보드</span></h1>
    <p>유튜브 쇼츠 · 틱톡 · 인스타 릴스를 한 곳에서 분석하고, 분석 이력을 쌓아 트렌드를 추적하세요</p>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="card">
    <div class="card-title" id="infoTitle">영상 정보 입력</div>
    <div id="infoFields"></div>
  </div>

  <div class="card">
    <div class="card-title">성과 지표</div>
    <p class="card-desc" id="metricsDesc"></p>
    <div class="grid-3" id="metricFields"></div>
    <div class="field" style="margin-top:18px"><label>추가 메모 <span class="hint">선택사항 — 업로드 시간, 썸네일, BGM 등</span></label><textarea id="notes" style="min-height:70px"></textarea></div>
  </div>

  <button class="btn btn-primary" id="analyzeBtn" onclick="analyze()">
    <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
    AI 분석 시작
  </button>

  <div class="loading" id="loading"><div class="spinner"></div><p id="loadingText">AI가 분석 중이에요...</p></div>

  <div class="result card" id="result" style="margin-top:24px">
    <div id="resultContent"></div>
    <div class="action-row">
      <button class="btn btn-secondary" onclick="copyResult()">결과 복사</button>
      <button class="btn btn-secondary" onclick="resetForm()">새 분석</button>
    </div>
  </div>

  <div class="card" style="margin-top:24px">
    <div class="card-title" style="display:flex;align-items:center;justify-content:space-between">
      <span>분석 이력</span>
      <button class="btn btn-secondary" onclick="clearHistory()" style="text-transform:none;letter-spacing:0">전체 삭제</button>
    </div>
    <div class="history-list" id="historyList"></div>
  </div>
</main>
<script src="core.js"></script>
</body>
</html>
