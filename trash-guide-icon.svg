<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="버릴까말까 아이콘">
  <defs>
    <linearGradient id="tgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="0.6" stop-color="#34d399"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <radialGradient id="tgCore" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#122a20"/>
      <stop offset="1" stop-color="#081410"/>
    </radialGradient>
    <filter id="tgGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="48" cy="48" r="42" fill="url(#tgCore)"/>
  <circle cx="48" cy="48" r="42" fill="none" stroke="url(#tgGrad)" stroke-width="3.5" filter="url(#tgGlow)"/>
  <!-- 쓰레기통 -->
  <g stroke="url(#tgGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#tgGlow)">
    <path d="M34 38 h28 l-3 26 a4 4 0 0 1 -4 3.6 h-14 a4 4 0 0 1 -4 -3.6 z"/>
    <path d="M30 38 h36"/>
    <path d="M42 38 v-4 a3 3 0 0 1 3 -3 h6 a3 3 0 0 1 3 3 v4"/>
  </g>
  <!-- 물음표 -->
  <g filter="url(#tgGlow)">
    <path d="M44 49 a4.5 4.5 0 1 1 6.5 4 c-1.6 0.9 -2.5 1.8 -2.5 3.6" fill="none" stroke="#e5eaf2" stroke-width="4" stroke-linecap="round"/>
    <circle cx="48" cy="61.5" r="2.6" fill="#e5eaf2"/>
  </g>
</svg>
