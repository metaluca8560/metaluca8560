<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>우리동네 무슨 축제? — AI 축제·행사 큐레이터</title>
  <meta name="description" content="지역과 취향을 말하면 AI가 실제 열리는 축제·행사를 대화로 추천해주는 큐레이터." />
  <meta property="og:title" content="우리동네 무슨 축제?" />
  <meta property="og:description" content="AI와 대화하면서 우리 동네·가고 싶은 지역의 진짜 축제를 찾아보세요." />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fastly.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://fastly.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ===== 상단 ===== -->
  <header class="topbar">
    <div class="wrap topbar-in">
      <a href="#top" class="logo" id="top">🎉 우리동네 <em>무슨 축제?</em></a>
    </div>
  </header>

  <div class="intro-bar">
    <div class="wrap">💬 지역이랑 취향을 말해주시면, AI가 <strong>실제 열리는 축제·행사</strong> 중에서 골라 추천해 드려요.</div>
  </div>

  <main class="wrap main">

    <!-- ===== 지역 선택 ===== -->
    <section class="card">
      <h2>📍 어느 지역이 궁금하세요?</h2>
      <p class="muted">선택 안 하시면 전국 축제 중에서 찾아드려요.</p>
      <div class="region-grid" id="regionGrid">
        <button class="region-chip" data-region="">전국</button>
        <button class="region-chip" data-region="서울특별시">서울</button>
        <button class="region-chip" data-region="부산광역시">부산</button>
        <button class="region-chip" data-region="대구광역시">대구</button>
        <button class="region-chip" data-region="인천광역시">인천</button>
        <button class="region-chip" data-region="광주광역시">광주</button>
        <button class="region-chip" data-region="대전광역시">대전</button>
        <button class="region-chip" data-region="울산광역시">울산</button>
        <button class="region-chip" data-region="세종특별자치시">세종</button>
        <button class="region-chip" data-region="경기도">경기</button>
        <button class="region-chip" data-region="강원특별자치도">강원</button>
        <button class="region-chip" data-region="충청북도">충북</button>
        <button class="region-chip" data-region="충청남도">충남</button>
        <button class="region-chip" data-region="전북특별자치도">전북</button>
        <button class="region-chip" data-region="전라남도">전남</button>
        <button class="region-chip" data-region="경상북도">경북</button>
        <button class="region-chip" data-region="경상남도">경남</button>
        <button class="region-chip" data-region="제주특별자치도">제주</button>
      </div>
    </section>

    <!-- ===== AI 대화 ===== -->
    <section class="card">
      <h2>🤖 AI 큐레이터에게 물어보기</h2>
      <div id="chatBox" class="chat-box" aria-live="polite"></div>
      <div id="chatChips" class="chat-chips" hidden>
        <button type="button" class="chip">이번 주말에 놀러가고 싶어요</button>
        <button type="button" class="chip">가족이랑 갈만한 곳 찾아요</button>
        <button type="button" class="chip">공연이나 음악 축제 좋아해요</button>
      </div>
      <form id="chatForm" class="chat-form">
        <input id="chatInput" type="text" autocomplete="off" placeholder="예: 이번 주말에 가족이랑 갈만한 축제 있을까요?" aria-label="메시지 입력" />
        <button type="submit" class="chat-send" aria-label="보내기">↑</button>
      </form>
      <p class="chat-note" id="chatNote" hidden></p>
    </section>

  </main>

  <footer class="footer">
    <div class="wrap">
      <p><strong>우리동네 무슨 축제?</strong> — AI 축제·행사 큐레이터</p>
      <p class="fine">축제 정보는 한국관광공사 공공데이터를 기반으로 하며, 실제 일정·장소는 주최측 사정에 따라 변경될 수 있습니다. 방문 전 공식 채널에서 다시 확인해 주세요.</p>
      <p class="fine">© <span id="year"></span> 우리동네 무슨 축제? (MVP)</p>
    </div>
  </footer>

  <script src="config.js"></script>
  <script src="chat.js"></script>
</body>
</html>
