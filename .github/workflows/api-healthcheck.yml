name: API Health Check

# 미니앱 백엔드(Cloudflare Worker)가 조용히 죽는 걸 잡아내기 위한 점검.
#
# 예전에 메디앱 AI가 며칠간 죽어 있었는데 아무도 몰랐다. Worker는 멀쩡히
# 살아서 "AI 키 미설정" 500을 뱉고 있었고, 병원 목록은 잘 떠서 겉보기엔
# 정상이었다. 단순 ping으로는 이런 걸 못 잡는다.
#
# 그래서 빈 요청 {} 을 보낸다. 각 핸들러가 "키 검사 → 입력 검사" 순서라서
# 응답 코드만으로 상태가 갈린다:
#   400 = Worker 살아 있고 키도 있음 (AI 호출 안 일어남 → 비용 0)
#   500 = 키가 빠졌음
#   그 외/무응답 = Worker가 죽었음
on:
  schedule:
    - cron: "0 0 * * *" # 매일 00:00 UTC = 오전 9시 KST
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 백엔드 상태 점검
        run: |
          MEDI="https://medi-api.atlia0318.workers.dev"
          FESTIVAL="https://festival-api.atlia0318.workers.dev"
          SHARED="https://small-recipe-9345.atlia0318.workers.dev"

          # 서울시청 좌표 — 어느 위치든 결과가 나오는 곳이면 된다.
          LAT=37.5665
          LNG=126.9780

          FAILED=0
          note() { echo "$1"; }
          fail() { echo "  ✗ $1"; FAILED=1; }
          pass() { echo "  ✓ $1"; }

          # 빈 요청을 보내 "키 있음(400)"인지 "키 없음(500)"인지 확인한다.
          check_key() {
            local label="$1" url="$2"
            local code
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 \
              -X POST "$url" -H "Content-Type: application/json" -d '{}')
            case "$code" in
              400) pass "$label — 정상 (키 등록됨)" ;;
              500) fail "$label — AI 키가 등록돼 있지 않습니다 (HTTP 500)" ;;
              000) fail "$label — 응답 없음. Worker가 죽었거나 주소가 바뀌었습니다" ;;
              *)   fail "$label — 예상 밖 응답 HTTP $code" ;;
            esac
          }

          # 실제 데이터를 받아오는 엔드포인트. 공공데이터가 간헐적으로 522를
          # 내므로 한 번 실패하면 20초 뒤 재시도해서 헛알람을 줄인다.
          check_data() {
            local label="$1" url="$2" attempt body code
            for attempt in 1 2; do
              body=$(curl -s --max-time 40 -w $'\n%{http_code}' "$url")
              code=$(printf '%s' "$body" | tail -n1)
              body=$(printf '%s' "$body" | sed '$d')

              if [ "$code" = "200" ] && ! printf '%s' "$body" | jq -e '.error' >/dev/null 2>&1; then
                local n
                n=$(printf '%s' "$body" | jq -r '.items | length' 2>/dev/null || echo 0)
                if [ "$n" -gt 0 ]; then
                  pass "$label — 정상 (${n}건)"
                  return
                fi
                [ "$attempt" = 2 ] && fail "$label — 응답은 왔지만 결과가 0건입니다"
              else
                local msg
                msg=$(printf '%s' "$body" | jq -r '.error // empty' 2>/dev/null)
                [ "$attempt" = 2 ] && fail "$label — HTTP $code ${msg:+/ $msg}"
              fi
              [ "$attempt" = 1 ] && sleep 20
            done
          }

          note "[메디앱] $MEDI"
          check_key  "  AI 문진 /triage"            "$MEDI/triage"
          check_data "  응급실 /hospitals"          "$MEDI/hospitals?lat=$LAT&lng=$LNG"
          check_data "  약국 /pharmacies"           "$MEDI/pharmacies?lat=$LAT&lng=$LNG"
          check_data "  병원 /hospitals-general"    "$MEDI/hospitals-general?lat=$LAT&lng=$LNG"

          note ""
          note "[축제앱] $FESTIVAL"
          check_key  "  AI 대화 /chat"              "$FESTIVAL/chat"
          check_data "  축제목록 /festivals"        "$FESTIVAL/festivals"

          note ""
          note "[공용] $SHARED  (시장·타로·스캔·번역·음성)"
          check_key  "  요리추천 /recipe"           "$SHARED/recipe"
          check_key  "  타로 /tarot"                "$SHARED/tarot"
          check_key  "  번역 /translate"            "$SHARED/translate"
          check_key  "  음성합성 /voice/tts"        "$SHARED/voice/tts"
          check_key  "  스캔 /scan"                 "$SHARED/scan"

          note ""
          if [ "$FAILED" = 1 ]; then
            note "점검 실패. 위에 ✗ 표시된 항목을 확인하세요."
            note ""
            note "자주 있는 원인:"
            note "  - AI 키 미등록 → 해당 폴더에서: \"키값\" | npx wrangler secret put GEMINI_API_KEY"
            note "    (medi/server · festival/server · shared-api 중 해당하는 곳)"
            note "  - 등록 후에는 npx wrangler deploy 까지 해야 반영됩니다."
            note "  - 공공데이터 오류는 활용신청 만료·일일 한도 초과일 수 있습니다: https://www.data.go.kr"
            exit 1
          fi
          note "모든 백엔드 정상입니다."
