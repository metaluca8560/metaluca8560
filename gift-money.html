<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>축의금 계산기 — AI 트렌드 다락방</title>
  <meta name="description" content="관계와 상황만 고르면 AI가 적정 축의금·부의금 금액과 매너까지 알려드려요." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="축의금 계산기 💌" />
  <meta property="og:description" content="5만? 10만? 매번 고민되는 경조사비, 관계랑 상황만 고르면 AI가 적정 금액이랑 매너까지 알려드려요" />
  <meta property="og:image" content="https://metaluca8560.vercel.app/gift-og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:url" content="https://metaluca8560.vercel.app/gift-money.html" />
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <link rel="preconnect" href="https://fastly.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://fastly.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #140b10;
      --card: #201118;
      --card2: #29161f;
      --line: #43222f;
      --text: #f9ecf1;
      --muted: #b8919f;
      --pink: #f472b6;
      --pink-deep: #db2777;
      --gold: #fbbf24;
      --rose: #fb7185;
    }
    html { -webkit-text-size-adjust: 100%; }
    body { font-family: 'Pretendard', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 60px; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 0 18px; }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 18px 0 6px; }
    .header a { color: var(--muted); font-size: 14px; text-decoration: none; }
    .hero { padding: 22px 0 8px; }
    .hero h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; }
    .hero h1 em { font-style: normal; color: var(--pink); }
    .hero p { margin-top: 8px; color: var(--muted); font-size: 15px; line-height: 1.55; }
    .section-label { font-size: 14px; font-weight: 700; color: var(--muted); margin: 22px 0 10px; }
    .seg { display: flex; gap: 8px; flex-wrap: wrap; }
    .seg button {
      flex: 1; min-width: 74px; background: var(--card); border: 1.5px solid var(--line); color: var(--text);
      border-radius: 12px; padding: 12px 4px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
    }
    .seg button.on { border-color: var(--pink); background: rgba(244,114,182,.1); color: var(--pink); }
    .field textarea {
      width: 100%; background: var(--card); border: 1.5px solid var(--line); color: var(--text);
      border-radius: 12px; padding: 14px 16px; font-size: 15px; font-family: inherit; resize: none;
    }
    .field textarea:focus { outline: none; border-color: var(--pink); }
    .cta {
      width: 100%; margin-top: 26px; background: linear-gradient(135deg, var(--pink), var(--pink-deep));
      color: #fff; border: none; border-radius: 16px; padding: 17px 0;
      font-size: 17px; font-weight: 800; cursor: pointer; font-family: inherit;
      box-shadow: 0 8px 24px rgba(219,39,119,.3);
    }
    .err { display: none; margin-top: 16px; background: rgba(251,113,133,.1); border: 1.5px solid rgba(251,113,133,.4); color: var(--rose); border-radius: 14px; padding: 14px 16px; font-size: 14px; }
    .err.show { display: block; }
    .loading { display: none; text-align: center; padding: 40px 0 10px; }
    .loading.show { display: block; }
    .spinner { width: 38px; height: 38px; border-radius: 50%; margin: 0 auto 14px; border: 4px solid var(--line); border-top-color: var(--pink); animation: spin .9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading p { color: var(--muted); font-size: 14px; }

    #result { display: none; margin-top: 30px; }
    #result.show { display: block; }
    .amount-card {
      background: linear-gradient(135deg, rgba(244,114,182,.16), rgba(219,39,119,.05));
      border: 1.5px solid rgba(244,114,182,.5); border-radius: 20px; padding: 26px 20px; text-align: center;
    }
    .amount-card .t { font-size: 14px; font-weight: 700; color: var(--pink); }
    .amount-card .amount { font-size: 44px; font-weight: 800; margin-top: 8px; letter-spacing: -1px; }
    .amount-card .range { margin-top: 6px; color: var(--muted); font-size: 13.5px; }
    .reason { background: var(--card); border: 1.5px solid var(--line); border-radius: 16px; padding: 16px 18px; font-size: 14.5px; line-height: 1.65; margin-top: 12px; }
    .tips { background: var(--card); border: 1.5px solid var(--line); border-radius: 16px; padding: 6px 18px; }
    .tips li { list-style: none; padding: 12px 0; font-size: 14px; line-height: 1.55; border-bottom: 1px solid var(--line); }
    .tips li:last-child { border-bottom: none; }
    .tips li::before { content: '💡 '; }
    .envelope {
      background: var(--card2); border: 1.5px dashed rgba(244,114,182,.5); border-radius: 16px;
      padding: 16px 18px; text-align: center; margin-top: 4px;
    }
    .envelope .lbl { font-size: 12.5px; color: var(--muted); }
    .envelope .txt { font-size: 20px; font-weight: 800; margin-top: 6px; letter-spacing: 2px; }
    .actions { display: flex; gap: 10px; margin-top: 22px; }
    .actions button { flex: 1; border-radius: 14px; padding: 14px 0; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; border: 1.5px solid var(--line); background: var(--card); color: var(--text); }
    .actions .primary { background: linear-gradient(135deg, var(--pink), var(--pink-deep)); color: #fff; border: none; }
    .disclaimer { margin-top: 20px; color: var(--muted); font-size: 12px; line-height: 1.6; text-align: center; }
    @keyframes pop { 0% { transform: scale(.85); opacity: 0; } 70% { transform: scale(1.03); } 100% { transform: scale(1); opacity: 1; } }
    .pop { animation: pop .5s cubic-bezier(.2,1.4,.4,1) both; }
    .confetti-bit { position: fixed; top: -12px; width: 10px; height: 14px; border-radius: 3px; pointer-events: none; z-index: 99; animation: cfall linear forwards; }
    @keyframes cfall { to { transform: translateY(110vh) rotate(720deg); opacity: .9; } }
    /* ── 경조사 장부 ── */
    .record-btn { width: 100%; margin-top: 12px; background: var(--card2); border: 1.5px dashed rgba(244,114,182,.5); color: var(--pink); border-radius: 14px; padding: 13px 0; font-size: 14.5px; font-weight: 700; cursor: pointer; font-family: inherit; }
    .ledger-sum { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .ledger-sum > div { background: var(--card); border: 1.5px solid var(--line); border-radius: 16px; padding: 14px 16px; text-align: center; }
    .ledger-sum .l { font-size: 12.5px; color: var(--muted); font-weight: 600; }
    .ledger-sum .v { font-size: 18px; font-weight: 800; margin-top: 5px; }
    .ledger-sum .v.gave { color: var(--pink); }
    .ledger-sum .v.got { color: var(--gold); }
    .ledger-search { width: 100%; background: var(--card); border: 1.5px solid var(--line); color: var(--text); border-radius: 12px; padding: 13px 16px; font-size: 14.5px; font-family: inherit; margin-top: 10px; }
    .ledger-search:focus { outline: none; border-color: var(--pink); }
    .person-sum { display: none; margin-top: 10px; background: rgba(251,191,36,.08); border: 1.5px solid rgba(251,191,36,.4); border-radius: 14px; padding: 13px 16px; font-size: 13.5px; line-height: 1.6; }
    .person-sum.show { display: block; }
    .person-sum b { color: var(--gold); }
    .ledger-row { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-top: 8px; }
    .ledger-row .dir { font-size: 11px; font-weight: 800; border-radius: 999px; padding: 4px 9px; white-space: nowrap; }
    .ledger-row .dir.gave { background: rgba(244,114,182,.15); color: var(--pink); }
    .ledger-row .dir.got { background: rgba(251,191,36,.15); color: var(--gold); }
    .ledger-row .info { flex: 1; min-width: 0; }
    .ledger-row .nm { font-size: 14.5px; font-weight: 700; }
    .ledger-row .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .ledger-row .amt { font-size: 15px; font-weight: 800; white-space: nowrap; }
    .ledger-row .del { background: none; border: none; color: var(--muted); font-size: 16px; cursor: pointer; padding: 4px; }
    .ledger-empty { color: var(--muted); font-size: 13.5px; text-align: center; padding: 18px 0; }
    #ledgerForm { display: none; background: var(--card2); border: 1.5px solid var(--line); border-radius: 16px; padding: 16px; margin-top: 10px; }
    #ledgerForm.show { display: block; }
    #ledgerForm input, #ledgerForm select { width: 100%; background: var(--card); border: 1.5px solid var(--line); color: var(--text); border-radius: 10px; padding: 12px 14px; font-size: 14.5px; font-family: inherit; margin-bottom: 9px; color-scheme: dark; }
    #ledgerForm .fr { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    #ledgerForm .dirseg { display: flex; gap: 8px; margin-bottom: 9px; }
    #ledgerForm .dirseg button { flex: 1; background: var(--card); border: 1.5px solid var(--line); color: var(--text); border-radius: 10px; padding: 11px 0; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
    #ledgerForm .dirseg button.on { border-color: var(--pink); color: var(--pink); background: rgba(244,114,182,.1); }
    .save-btn { width: 100%; background: linear-gradient(135deg, var(--pink), var(--pink-deep)); color: #fff; border: none; border-radius: 12px; padding: 13px 0; font-size: 15px; font-weight: 800; cursor: pointer; font-family: inherit; }
  </style>
</head>
<body>
<div class="wrap">
  <header class="header">
    <span style="font-size:14px;font-weight:700;color:var(--pink)">GIFT MONEY</span>
    <a href="index.html">AI 트렌드 다락방</a>
  </header>

  <section class="hero">
    <h1>축의금, <em>얼마 내지?</em></h1>
    <p>5만? 10만? 매번 고민되는 경조사비.<br>관계랑 상황만 고르면 AI가 정리해드려요.</p>
  </section>

  <div class="section-label">무슨 자리예요?</div>
  <div class="seg" id="eventSeg">
    <button data-v="결혼식" class="on">결혼식 💒</button>
    <button data-v="장례식">장례식 🕊️</button>
    <button data-v="돌잔치">돌잔치 🎂</button>
    <button data-v="개업식">개업 🎊</button>
  </div>

  <div class="section-label">어떤 사이예요?</div>
  <div class="seg" id="relSeg">
    <button data-v="가끔 보는 지인">지인</button>
    <button data-v="직장 동료" class="on">직장 동료</button>
    <button data-v="친한 친구">친한 친구</button>
    <button data-v="절친 또는 가까운 친척">절친·친척</button>
  </div>

  <div class="section-label">참석은?</div>
  <div class="seg" id="attendSeg">
    <button data-v="참석해서 식사까지" class="on">참석 + 식사</button>
    <button data-v="참석만 하고 식사 안 함">참석만</button>
    <button data-v="불참하고 마음만 전함">불참 (송금)</button>
  </div>

  <div class="section-label">참고할 상황 (선택)</div>
  <div class="field">
    <textarea id="context" rows="2" placeholder="예: 10년지기인데 제 결혼식 때 20만원 줬어요 / 호텔 결혼식이에요"></textarea>
  </div>

  <button class="cta" onclick="analyze()">적정 금액 알아보기 💌</button>
  <div class="err" id="errBox"></div>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>AI가 요즘 시세랑 매너를 따져보고 있어요...</p>
  </div>

  <section id="result">
    <div id="resultContent"></div>
    <div class="actions">
      <button class="primary" onclick="shareResult()">공유하기</button>
      <button onclick="resetForm()">다시 계산</button>
    </div>
    <p class="disclaimer">금액은 2026년 일반적인 시세 기준 참고용이에요.<br>마음이 담긴 금액이라면 정답은 없어요 :)</p>
  </section>

  <div class="section-label">📒 내 경조사 장부</div>
  <div class="ledger-sum">
    <div><div class="l">내가 낸 마음</div><div class="v gave" id="sumGave">0원</div></div>
    <div><div class="l">내가 받은 마음</div><div class="v got" id="sumGot">0원</div></div>
  </div>
  <input class="ledger-search" id="ledgerSearch" placeholder="🔍 이름으로 찾기 — 이 분이 나한테 얼마 냈더라?">
  <div class="person-sum" id="personSum"></div>
  <div id="ledgerList"></div>
  <button class="record-btn" onclick="toggleForm()">✏️ 기록 추가하기</button>
  <div id="ledgerForm">
    <div class="dirseg" id="dirSeg">
      <button data-v="gave" class="on">내가 냈어요</button>
      <button data-v="got">내가 받았어요</button>
    </div>
    <input type="text" id="lgName" placeholder="이름 (예: 김민지)">
    <div class="fr">
      <select id="lgEvent"><option>결혼식</option><option>장례식</option><option>돌잔치</option><option>개업식</option><option>기타</option></select>
      <input type="text" id="lgAmount" inputmode="numeric" placeholder="금액 (예: 100,000)">
    </div>
    <input type="date" id="lgDate">
    <button class="save-btn" onclick="saveEntry()">장부에 저장 💾</button>
  </div>
  <p class="disclaimer">장부 기록은 서버 전송 없이 내 폰에만 저장돼요 🔒</p>
</div>

<script>
  const PROXY_URL = '/api/proxy'

  function segInit(id) {
    const seg = document.getElementById(id)
    seg.querySelectorAll('button').forEach(b => {
      b.onclick = () => { seg.querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on') }
    })
  }
  segInit('eventSeg'); segInit('relSeg'); segInit('attendSeg')
  const segVal = id => document.querySelector(`#${id} button.on`).dataset.v

  let lastAmount = ''

  async function analyze() {
    document.getElementById('errBox').classList.remove('show')
    document.getElementById('result').classList.remove('show')
    document.getElementById('loading').classList.add('show')

    const ev = segVal('eventSeg'), rel = segVal('relSeg'), att = segVal('attendSeg')
    const ctx = document.getElementById('context').value.trim()

    // 자리마다 식대·관례가 달라요. 결혼식 기준 문구를 장례식·개업에까지 쓰면
    // "장례식인데 예식장 식대" 같은 실례되는 답이 나와서 자리별로 갈라줘요.
    const NOTE_BY_EVENT = {
      '결혼식': '요즘 예식장 식대(수도권 7~9만원, 호텔 10만원 이상)를 감안해 참석+식사면 식대 이상이 매너.',
      '돌잔치': '돌잔치 식대(1인 5~7만원)를 감안하되, 결혼식보다는 가볍게 잡는 것이 관례.',
      '장례식': '장례식장 식대(1인 2~3만원)로 결혼식보다 부담이 적어요. 부의는 액수보다 조문 자체가 예의이고, 호화로운 표현이나 축하 어휘는 절대 쓰지 마세요.',
      '개업식': '식대 개념이 없어요. 현금 대신 화환·화분이 일반적이며, 현금이면 사업 응원의 뜻으로 관계에 맞춰 정하세요.',
    }

    const prompt = [
      '당신은 한국 경조사 문화와 2026년 시세에 밝은 예절 전문가입니다. 적정 경조사비를 정해주세요.',
      `- 자리: ${ev}`,
      `- 관계: ${rel}`,
      `- 참석 여부: ${att}`,
      ctx ? `- 추가 상황: ${ctx}` : '',
      '',
      `고려사항: ${NOTE_BY_EVENT[ev] || NOTE_BY_EVENT['결혼식']}`,
      `모든 문장은 '${ev}' 맥락에 맞는 표현만 쓰세요. 다른 자리의 용어(예: 장례식 답변에 '예식장', '축의금', '하객')를 섞지 마세요.`,
      '금액은 한국 관습(5·10·15·20만원 단위, 3만원은 요즘 지양)을 따르세요. 받은 만큼 돌려주는 상호성도 반영하세요.',
      '',
      '규칙: 반드시 아래 JSON만 출력. 다른 텍스트 금지. 모든 값 한국어 (영어 혼용 금지).',
      'amount는 "10만원"처럼 간결하게. range는 "7~10만원"식 허용 범위. reason은 왜 이 금액인지 2~3문장.',
      'tips는 봉투·이체·매너 팁 3개. envelope는 봉투 앞면에 쓰는 한자/문구 (예: 축결혼(祝結婚)). 장례식이면 부의(賻儀).',
      '{"amount":"","range":"","reason":"","tips":["","",""],"envelope":""}',
    ].filter(Boolean).join('\n')

    try {
      const res = await fetch(PROXY_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt, temperature: 0.3 }) })
      const data = await res.json()
      if (!res.ok) throw new Error(data.error || 'AI 호출 실패')
      const text = (data.content && data.content[0] && data.content[0].text) || ''
      renderResult(text)
    } catch (e) {
      const box = document.getElementById('errBox')
      box.textContent = '앗, ' + (e.message || '계산에 실패했어요.') + ' 잠시 후 다시 시도해주세요.'
      box.classList.add('show')
    } finally {
      document.getElementById('loading').classList.remove('show')
    }
  }

  function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

  function renderResult(text) {
    let d = null
    try { const m = text.match(/\{[\s\S]*\}/); if (m) d = JSON.parse(m[0]) } catch (_) {}
    if (!d || !d.amount) {
      const box = document.getElementById('errBox')
      box.textContent = '결과를 읽는 데 실패했어요. 한 번만 다시 눌러주세요!'
      box.classList.add('show')
      return
    }
    lastAmount = d.amount
    const ev = segVal('eventSeg'), rel = segVal('relSeg')
    let html = `
      <div class="amount-card">
        <div class="t">${esc(rel)} ${esc(ev)} 적정 금액</div>
        <div class="amount">${esc(d.amount)}</div>
        ${d.range ? `<div class="range">무난한 범위: ${esc(d.range)}</div>` : ''}
      </div>
      <div class="reason">${esc(d.reason)}</div>`
    if (Array.isArray(d.tips) && d.tips.length) {
      html += `<div class="section-label">챙기면 좋은 매너</div><ul class="tips">`
      d.tips.forEach(t => { html += `<li>${esc(t)}</li>` })
      html += `</ul>`
    }
    if (d.envelope) {
      html += `<div class="section-label">봉투에는 이렇게</div>
        <div class="envelope"><div class="lbl">봉투 앞면 문구</div><div class="txt">${esc(d.envelope)}</div></div>`
    }
    html += `<button class="record-btn" onclick="recordFromResult()">📒 이 금액 장부에 기록하기</button>`
    document.getElementById('resultContent').innerHTML = html
    const card = document.querySelector('.amount-card')
    if (card) { card.classList.add('pop') }
    confetti(36)
    document.getElementById('result').classList.add('show')
    document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'start' })
  }

  // ── 폭죽: 결과의 임팩트 담당 ──
  function confetti(n) {
    const colors = ['#f472b6','#fbbf24','#4ade80','#60a5fa','#fff']
    for (let i = 0; i < (n || 36); i++) {
      const c = document.createElement('div')
      c.className = 'confetti-bit'
      c.style.left = Math.random() * 100 + 'vw'
      c.style.background = colors[Math.floor(Math.random() * colors.length)]
      c.style.animationDuration = (1.4 + Math.random() * 1.4) + 's'
      c.style.animationDelay = Math.random() * .3 + 's'
      document.body.appendChild(c)
      setTimeout(() => c.remove(), 3200)
    }
  }

  // ── 경조사 장부: 폰에만 저장되는 주고받은 기록 ──
  const LKEY = 'giftLedger'
  const loadLedger = () => { try { return JSON.parse(localStorage.getItem(LKEY) || '[]') } catch (_) { return [] } }
  const saveLedger = list => { try { localStorage.setItem(LKEY, JSON.stringify(list)) } catch (_) {} }
  const fmtWon = v => v >= 10000 && v % 10000 === 0 ? (v / 10000) + '만원' : v.toLocaleString('ko-KR') + '원'

  document.getElementById('lgDate').value = new Date().toISOString().slice(0, 10)
  document.getElementById('lgAmount').addEventListener('input', e => {
    const v = e.target.value.replace(/[^\d]/g, '')
    e.target.value = v ? Number(v).toLocaleString('ko-KR') : ''
  })
  document.querySelectorAll('#dirSeg button').forEach(b => {
    b.onclick = () => { document.querySelectorAll('#dirSeg button').forEach(x => x.classList.remove('on')); b.classList.add('on') }
  })

  function toggleForm() { document.getElementById('ledgerForm').classList.toggle('show') }

  function saveEntry() {
    const name = document.getElementById('lgName').value.trim()
    const amount = Number(document.getElementById('lgAmount').value.replace(/[^\d]/g, '')) || 0
    if (!name || !amount) { alert('이름과 금액을 입력해주세요!'); return }
    const list = loadLedger()
    list.push({
      id: Date.now(), name,
      dir: document.querySelector('#dirSeg button.on').dataset.v,
      event: document.getElementById('lgEvent').value,
      amount,
      date: document.getElementById('lgDate').value,
    })
    saveLedger(list)
    document.getElementById('lgName').value = ''; document.getElementById('lgAmount').value = ''
    document.getElementById('ledgerForm').classList.remove('show')
    renderLedger()
  }

  function delEntry(id) {
    if (!confirm('이 기록을 지울까요?')) return
    saveLedger(loadLedger().filter(e => e.id !== id))
    renderLedger()
  }

  function recordFromResult() {
    const m = String(lastAmount).match(/([\d.]+)\s*만/)
    const amt = m ? Math.round(parseFloat(m[1]) * 10000) : Number(String(lastAmount).replace(/[^\d]/g, '')) || 0
    document.getElementById('ledgerForm').classList.add('show')
    document.getElementById('lgAmount').value = amt ? amt.toLocaleString('ko-KR') : ''
    const ev = segVal('eventSeg')
    const sel = document.getElementById('lgEvent')
    ;[...sel.options].forEach(o => { if (o.value === ev) sel.value = ev })
    document.getElementById('ledgerForm').scrollIntoView({ behavior: 'smooth', block: 'center' })
    document.getElementById('lgName').focus()
  }

  function renderLedger() {
    const q = document.getElementById('ledgerSearch').value.trim()
    const all = loadLedger().sort((a, b) => (b.date || '').localeCompare(a.date || ''))
    const list = q ? all.filter(e => e.name.includes(q)) : all

    let gave = 0, got = 0
    all.forEach(e => { e.dir === 'gave' ? gave += e.amount : got += e.amount })
    document.getElementById('sumGave').textContent = fmtWon(gave)
    document.getElementById('sumGot').textContent = fmtWon(got)

    // 이름 검색 시: 상호성 요약 — 이 앱의 킬러 기능
    const ps = document.getElementById('personSum')
    if (q && list.length) {
      let pg = 0, pr = 0
      list.forEach(e => { e.dir === 'gave' ? pg += e.amount : pr += e.amount })
      ps.innerHTML = `<b>${q}</b>님과의 기록 — 내가 낸 ${fmtWon(pg)} · 받은 ${fmtWon(pr)}<br>` +
        (pr > 0 ? `이분이 주신 만큼 <b>${fmtWon(pr)}</b> 안팎으로 돌려드리면 딱 좋아요 :)` : '아직 받은 기록은 없어요.')
      ps.classList.add('show')
    } else { ps.classList.remove('show') }

    const el = document.getElementById('ledgerList')
    if (!list.length) {
      el.innerHTML = `<div class="ledger-empty">${q ? '검색 결과가 없어요' : '아직 기록이 없어요. 첫 경조사를 기록해보세요!'}</div>`
      return
    }
    el.innerHTML = list.map(e => `
      <div class="ledger-row">
        <span class="dir ${e.dir}">${e.dir === 'gave' ? '냈음' : '받음'}</span>
        <div class="info">
          <div class="nm">${esc(e.name)}</div>
          <div class="meta">${esc(e.event)} · ${esc(e.date || '')}</div>
        </div>
        <span class="amt">${fmtWon(e.amount)}</span>
        <button class="del" onclick="delEntry(${e.id})">✕</button>
      </div>`).join('')
  }
  document.getElementById('ledgerSearch').addEventListener('input', renderLedger)
  renderLedger()

  // ── 공유하기: 앱인토스 SDK → Web Share API → 클립보드 순으로 폴백 ──
  function buildShareText() {
    return `💌 축의금 계산기\n${lastAmount ? `이 상황엔 ${lastAmount}이 적정이래요! 너도 확인해봐~` : '경조사비 고민, AI가 3초 만에 정리해줘요.'}`
  }

  async function shareResult() {
    const text = buildShareText()
    try {
      if (window.AppsInToss && typeof window.AppsInToss.share === 'function') {
        let url = location.href
        if (typeof window.AppsInToss.getTossShareLink === 'function') {
          try { url = await window.AppsInToss.getTossShareLink() } catch (_) {}
        }
        await window.AppsInToss.share({ message: `${text}\n${url}` })
        return
      }
    } catch (_) { /* SDK 공유 실패 시 아래 폴백으로 */ }
    if (navigator.share) {
      try { await navigator.share({ title: '축의금 계산기', text, url: location.href }); return }
      catch (e) { if (e.name === 'AbortError') return }
    }
    await navigator.clipboard.writeText(`${text}\n${location.href}`)
    alert('공유 문구가 클립보드에 복사됐어요!')
  }

  function resetForm() {
    document.getElementById('result').classList.remove('show')
    document.getElementById('context').value = ''
    window.scrollTo({ top: 0, behavior: 'smooth' })
  }
</script>
</body>
</html>
