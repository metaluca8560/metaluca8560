<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="클로페이 로고">
  <defs>
    <linearGradient id="payGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="payCore" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#0e1524"/>
      <stop offset="1" stop-color="#050810"/>
    </radialGradient>
    <filter id="payGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="48" cy="48" r="42" fill="url(#payCore)"/>
  <circle cx="48" cy="48" r="42" fill="none" stroke="url(#payGrad)" stroke-width="3.5" filter="url(#payGlow)"/>
  <ellipse cx="48" cy="48" rx="41" ry="14" fill="none" stroke="url(#payGrad)" stroke-width="2" opacity="0.5" transform="rotate(-24 48 48)"/>
  <!-- 카드 -->
  <g filter="url(#payGlow)">
    <rect x="30" y="35" width="36" height="26" rx="6" fill="none" stroke="url(#payGrad)" stroke-width="6"/>
    <path d="M30 45 H66" stroke="#38bdf8" stroke-width="5"/>
  </g>
  <circle cx="60" cy="55" r="3.5" fill="#38bdf8" filter="url(#payGlow)"/>
</svg>
