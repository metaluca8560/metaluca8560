<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>구독료 다이어트 — AI 트렌드 다락방</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --line:#252a34; --text:#e8eaed; --muted:#9aa0aa;
          --accent:#3182f6; --warn:#ff6b6b; --good:#51cf66; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
         padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom); }
  .wrap { max-width:480px; margin:0 auto; padding:28px 0 40px; }
  h1 { font-size:20px; margin:0 0 6px; }
  .lead { color:var(--muted); font-size:14px; margin:0 0 20px; }
  .cat { color:var(--muted); font-size:13px; margin:18px 0 8px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { padding:10px 14px; border-radius:999px; border:1px solid var(--line);
          background:var(--card); color:var(--text); font-size:14px; cursor:pointer; }
  .chip.on { border-color:var(--accent); background:rgba(49,130,246,0.15); }
  .chip .won { color:var(--muted); font-size:12px; margin-left:6px; }
  .chip.on .won { color:var(--text); }
  .bar { position:sticky; bottom:0; background:var(--bg); padding:14px 0 0; margin-top:24px; }
  button { width:100%; padding:16px; font-size:16px; font-weight:700; border:0;
           border-radius:12px; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { background:#2a2f3a; color:var(--muted); cursor:default; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--text); }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:16px;
           padding:20px; margin-top:14px; }
  .panel h2 { font-size:16px; margin:0 0 4px; }
  .panel p { color:var(--muted); font-size:13px; margin:0 0 12px; }
  input { width:100%; padding:14px; font-size:18px; text-align:center; border-radius:12px;
          border:1px solid var(--line); background:#0b0d11; color:var(--text); }
  .err { color:#ff8787; font-size:13px; text-align:center; margin-top:8px; min-height:18px; }
  .row2 { display:flex; gap:10px; margin-top:12px; }
  .note { color:var(--muted); font-size:12px; text-align:center; margin-top:18px; }
</style>
</head>
<body>
<div class="wrap">

  <section id="pick">
    <h1>쓰고 있는 구독을 골라주세요</h1>
    <p class="lead">가격은 2026년 8월 기준이에요. 눌러서 고칠 수 있어요.</p>
    <div id="chipArea"></div>

    <div class="panel" id="conflictPanel" hidden style="border-color:var(--warn)">
      <div id="conflictBody"></div>
    </div>

    <div class="panel" id="pricePanel" hidden>
      <h2 id="priceTitle">금액</h2>
      <p>한 달에 얼마 내세요?</p>
      <p id="priceHint" style="color:var(--muted);font-size:12px"></p>
      <input id="priceInput" type="number" inputmode="numeric" placeholder="9900" />
      <div class="err" id="priceErr"></div>
      <div class="row2">
        <button class="ghost" id="priceCancel">취소</button>
        <button id="priceOk">확인</button>
      </div>
    </div>

    <div class="panel" id="customPanel" hidden>
      <h2>직접 추가</h2>
      <p>목록에 없는 구독이 있나요?</p>
      <input id="customName" type="text" placeholder="서비스 이름" />
      <div style="height:10px"></div>
      <input id="customPrice" type="number" inputmode="numeric" placeholder="한 달 금액" />
      <div class="err" id="customErr"></div>
      <div class="row2">
        <button class="ghost" id="customCancel">취소</button>
        <button id="customOk">추가</button>
      </div>
    </div>

    <div class="bar">
      <button class="ghost" id="addCustomBtn">+ 직접 추가</button>
      <div style="height:10px"></div>
      <button id="toResult" disabled>얼마 쓰는지 보기</button>
    </div>
    <p class="note">이 기록은 서버로 보내지 않고 내 폰에만 저장돼요 🔒</p>
  </section>

  <section id="result" hidden>
    <p class="lead" id="countLine"></p>
    <div class="panel" style="text-align:center">
      <div style="color:var(--muted);font-size:14px">한 달</div>
      <div style="font-size:26px;font-weight:700" id="monthly">-</div>
      <div style="color:var(--muted);font-size:14px;margin-top:14px">1년이면</div>
      <div style="font-size:40px;font-weight:800;color:var(--warn);letter-spacing:-1px" id="yearly">-</div>
      <div style="color:var(--muted);font-size:14px;margin-top:14px" id="perDay"></div>
      <div style="color:var(--muted);font-size:14px" id="coffee"></div>
    </div>
    <div class="panel">
      <h2>제일 비싼 것</h2>
      <div id="topList"></div>
    </div>
    <div class="bar">
      <button id="toDiet">안 쓰는 것 골라내기</button>
      <div style="height:10px"></div>
      <button class="ghost" id="shareBtn">공유하기</button>
      <div style="height:10px"></div>
      <button class="ghost" id="backToPick">다시 고르기</button>
    </div>
  </section>

  <section id="diet" hidden>
    <h1>3개월 넘게 안 쓴 게 있나요?</h1>
    <p class="lead">고른 것 중에서 눌러주세요.</p>
    <div id="unusedArea"></div>
    <div class="panel" id="savingBox" hidden style="text-align:center">
      <div style="color:var(--muted);font-size:14px">이것만 정리하면</div>
      <div style="font-size:32px;font-weight:800;color:var(--good)" id="savingYear">-</div>
      <div style="color:var(--muted);font-size:14px">1년에 아껴요</div>
    </div>
    <div class="bar">
      <button class="ghost" id="backToResult">뒤로</button>
    </div>
    <p class="note">해지는 각 서비스에서 해야 해요</p>
  </section>

</div>
<script src="subscription-data.js"></script>
<script src="subscription-math.js"></script>
<script>
  var KEY = 'subscription-diet';
  var won = function (n) { return Math.round(n).toLocaleString('ko-KR') + '원'; };

  // 이름 끝 글자에 받침이 있는지로 조사(은/는, 이/가, 을/를)를 고른다.
  // 한글로 끝나지 않는 이름("애플TV+", "네이버 MYBOX" 등)은 받침을 셀 수 없는데,
  // 이 앱에 나오는 그런 이름들은 실제로 "플러스"·"박스"처럼 받침 없는 소리로
  // 끝나므로, 판단이 안 될 때는 받침 없는 쪽(withoutBatchim)을 쓴다.
  function endsWithBatchim(name) {
    var trimmed = (name || '').trim();
    if (!trimmed) return null;
    var code = trimmed.charCodeAt(trimmed.length - 1);
    if (code < 0xAC00 || code > 0xD7A3) return null;
    return (code - 0xAC00) % 28 !== 0;
  }
  function josa(name, withBatchim, withoutBatchim) {
    var has = endsWithBatchim(name);
    return has ? withBatchim : withoutBatchim;
  }

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { return null; }
  }
  function save(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }

  // 기본 가격 위에 사용자가 고친 값을 덮어쓴 것이 state.prices 다.
  function defaultPrices() {
    var p = {};
    SUBSCRIPTION_SERVICES.forEach(function (s) { if (s.price !== null) p[s.id] = s.price; });
    return p;
  }

  var state = load() || { selected: [], prices: defaultPrices(), custom: [], unused: [] };

  // 이전 세션이 비정상 종료돼 "선택됐지만 가격은 모름" 상태가 남아있으면 정리한다.
  // 이 앱의 불변식은 "selected에 있으면 prices에도 값이 있다"인데, 이게 깨진 채로
  // 들고 가면 총액이 조용히 그 항목을 0원으로 세거나 화면과 계산이 어긋난다.
  // 가격을 몰라서 남은 선택은 되살리지 않고 선택 해제한다 — 칩이 눌리지 않은 채로
  // 보이는 게, 값도 모르면서 선택된 것처럼 보이는 것보다 사실과 가깝다.
  // 필요하면 사용자가 다시 눌러서 금액을 넣으면 된다.
  (function healOrphanSelections() {
    var before = state.selected.length;
    state.selected = state.selected.filter(function (id) {
      return typeof state.prices[id] === 'number';
    });
    if (state.selected.length !== before) save(state);
  })();

  var pendingId = null; // 금액 입력 패널이 열린 대상

  function allServices() { return SUBSCRIPTION_SERVICES.concat(state.custom); }

  function renderChips() {
    var area = document.getElementById('chipArea');
    area.textContent = '';
    var cats = [];
    allServices().forEach(function (s) { if (cats.indexOf(s.category) < 0) cats.push(s.category); });

    cats.forEach(function (cat) {
      var label = document.createElement('div');
      label.className = 'cat'; label.textContent = cat;
      area.appendChild(label);
      var box = document.createElement('div');
      box.className = 'chips';
      allServices().filter(function (s) { return s.category === cat; }).forEach(function (s) {
        var b = document.createElement('button');
        b.className = 'chip' + (state.selected.indexOf(s.id) >= 0 ? ' on' : '');
        b.type = 'button';
        b.appendChild(document.createTextNode(s.name));
        var price = state.prices[s.id];
        if (typeof price === 'number') {
          var w = document.createElement('span');
          w.className = 'won'; w.textContent = won(price);
          b.appendChild(w);
        }
        b.onclick = function () { toggle(s.id); };
        box.appendChild(b);
      });
      area.appendChild(box);
    });

    document.getElementById('toResult').disabled = state.selected.length === 0;
    renderConflicts();
  }

  // 서로 포함 관계인 두 서비스가 지금 "둘 다" 선택된 경우만 찾는다.
  // 총액이 실제로 부풀어 있는 순간에만 경고해야 나머지 시간엔 조용하다.
  function conflictPairs() {
    var pairs = [];
    SUBSCRIPTION_SERVICES.forEach(function (s) {
      if (!s.includedIn) return;
      if (state.selected.indexOf(s.id) < 0) return;
      if (state.selected.indexOf(s.includedIn) < 0) return;
      pairs.push({ name: s.name, hostName: nameOf(s.includedIn) });
    });
    return pairs;
  }

  function renderConflicts() {
    var pairs = conflictPairs();
    var panel = document.getElementById('conflictPanel');
    var body = document.getElementById('conflictBody');
    body.textContent = '';
    if (pairs.length === 0) { panel.hidden = true; return; }

    var title = document.createElement('p');
    title.style.cssText = 'color:var(--warn);font-size:13px;margin:0 0 6px;font-weight:700';
    title.textContent = '중복으로 포함된 구독이 있어요';
    body.appendChild(title);

    pairs.forEach(function (p) {
      var line = document.createElement('p');
      line.style.cssText = 'color:var(--muted);font-size:13px;margin:0 0 4px';
      line.textContent = p.name + josa(p.name, '은', '는') + ' ' + p.hostName + '에 이미 포함돼 있어요. 총액이 부풀어 있을 수 있으니 하나만 골라주세요.';
      body.appendChild(line);
    });

    panel.hidden = false;
  }

  function toggle(id) {
    var i = state.selected.indexOf(id);
    if (i >= 0) {
      state.selected.splice(i, 1);
      save(state); renderChips();
      return;
    }
    // 금액을 모르는 항목은 물어보기만 하고, 아직 selected에는 커밋하지 않는다.
    // 확인을 눌러 금액이 확정된 뒤에야 selected에 들어간다 — 그래야 패널이 열린
    // 채로 앱이 닫혀도 "선택은 됐는데 가격은 모름"인 상태가 저장되지 않는다.
    if (SubMath.missingPriceIds([id], state.prices).length > 0) {
      openPrice(id);
      return;
    }
    state.selected.push(id);
    save(state);
    renderChips();
  }

  function nameOf(id) {
    var found = allServices().filter(function (s) { return s.id === id; })[0];
    return found ? found.name : id;
  }

  function hintOf(id) {
    var found = allServices().filter(function (s) { return s.id === id; })[0];
    return found && found.hint ? found.hint : '';
  }

  function openPrice(id) {
    pendingId = id;
    document.getElementById('priceTitle').textContent = nameOf(id);
    document.getElementById('priceHint').textContent = hintOf(id);
    document.getElementById('priceInput').value =
      typeof state.prices[id] === 'number' ? state.prices[id] : '';
    document.getElementById('priceErr').textContent = '';
    document.getElementById('pricePanel').hidden = false;
    document.getElementById('priceInput').focus();
  }
  function closePrice() {
    pendingId = null;
    document.getElementById('pricePanel').hidden = true;
  }

  document.getElementById('priceOk').onclick = function () {
    var raw = document.getElementById('priceInput').value;
    var err = document.getElementById('priceErr');
    if (raw.trim() === '') { err.textContent = '금액을 넣어주세요'; return; }
    var v = Number(raw);
    if (!isFinite(v) || v < 0) { err.textContent = '0 이상의 숫자를 넣어주세요'; return; }
    state.prices[pendingId] = v;
    // 금액이 이제 확정됐으니 여기서만 selected에 커밋한다.
    if (state.selected.indexOf(pendingId) < 0) state.selected.push(pendingId);
    save(state); closePrice(); renderChips();
  };

  document.getElementById('priceCancel').onclick = function () {
    // 취소 시점엔 pendingId를 아직 selected에 넣지 않았으므로 되돌릴 것도 없다.
    // 혹시 이미 금액이 있는 채로 열렸던 경우(선택이 그대로 유지돼야 하는 경우)를
    // 대비해, 방어적으로 "금액이 여전히 없을 때만" selected에서 제거한다.
    if (pendingId && SubMath.missingPriceIds([pendingId], state.prices).length > 0) {
      var i = state.selected.indexOf(pendingId);
      if (i >= 0) state.selected.splice(i, 1);
      save(state);
    }
    closePrice(); renderChips();
  };

  document.getElementById('addCustomBtn').onclick = function () {
    document.getElementById('customName').value = '';
    document.getElementById('customPrice').value = '';
    document.getElementById('customErr').textContent = '';
    document.getElementById('customPanel').hidden = false;
  };
  document.getElementById('customCancel').onclick = function () {
    document.getElementById('customPanel').hidden = true;
  };
  document.getElementById('customOk').onclick = function () {
    var name = document.getElementById('customName').value.trim();
    var raw = document.getElementById('customPrice').value;
    var err = document.getElementById('customErr');
    if (name === '') { err.textContent = '이름을 넣어주세요'; return; }
    if (raw.trim() === '') { err.textContent = '금액을 넣어주세요'; return; }
    var v = Number(raw);
    if (!isFinite(v) || v < 0) { err.textContent = '0 이상의 숫자를 넣어주세요'; return; }
    var id = 'custom-' + (state.custom.length + 1) + '-' + name.length;
    state.custom.push({ id: id, name: name, category: '직접 추가', price: v });
    state.prices[id] = v;
    state.selected.push(id);
    save(state);
    document.getElementById('customPanel').hidden = true;
    renderChips();
  };

  function show(id) {
    ['pick', 'result', 'diet'].forEach(function (s) {
      document.getElementById(s).hidden = s !== id;
    });
    window.scrollTo(0, 0);
  }

  function renderResult() {
    var sum = SubMath.summarize(SubMath.monthlyTotal(state.selected, state.prices));
    document.getElementById('countLine').textContent =
      '쓰고 계신 구독 ' + state.selected.length + '개';
    document.getElementById('monthly').textContent = won(sum.monthly);
    document.getElementById('yearly').textContent = won(sum.yearly) + ' 💸';
    document.getElementById('perDay').textContent = '하루로 치면 ' + won(sum.daily);
    document.getElementById('coffee').textContent = '커피로 치면 ' + sum.coffees + '잔';

    var list = document.getElementById('topList');
    list.textContent = '';
    SubMath.topSpenders(state.selected, state.prices, 3).forEach(function (row, i) {
      var d = document.createElement('div');
      d.style.cssText = 'display:flex;justify-content:space-between;padding:10px 0;'
        + (i > 0 ? 'border-top:1px solid var(--line)' : '');
      var left = document.createElement('span');
      left.textContent = (i + 1) + '. ' + nameOf(row.id);
      var right = document.createElement('strong');
      right.textContent = won(row.price);
      d.appendChild(left); d.appendChild(right);
      list.appendChild(d);
    });
  }

  function renderDiet() {
    // result 화면 이후 선택이 바뀌었을 수도 있으니(취소 등), 더 이상 선택되지
    // 않은 항목은 unused에서도 지운다. 그래야 total도, 절약액도 항상 selected를
    // 기준으로 맞아떨어진다.
    state.unused = state.unused.filter(function (id) { return state.selected.indexOf(id) >= 0; });

    var area = document.getElementById('unusedArea');
    area.textContent = '';
    var box = document.createElement('div');
    box.className = 'chips';
    state.selected.forEach(function (id) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip' + (state.unused.indexOf(id) >= 0 ? ' on' : '');
      b.textContent = nameOf(id);
      b.onclick = function () {
        var i = state.unused.indexOf(id);
        if (i >= 0) state.unused.splice(i, 1); else state.unused.push(id);
        save(state); renderDiet();
      };
      box.appendChild(b);
    });
    area.appendChild(box);

    var saving = SubMath.savings(state.unused, state.prices);
    var boxEl = document.getElementById('savingBox');
    if (state.unused.length === 0) {
      boxEl.hidden = true;
    } else {
      boxEl.hidden = false;
      document.getElementById('savingYear').textContent = won(saving.yearly);
    }
    save(state);
  }

  document.getElementById('toResult').onclick = function () { renderResult(); show('result'); };
  document.getElementById('backToPick').onclick = function () { renderChips(); show('pick'); };
  document.getElementById('toDiet').onclick = function () { renderDiet(); show('diet'); };
  document.getElementById('backToResult').onclick = function () { renderResult(); show('result'); };

  document.getElementById('shareBtn').onclick = function () {
    var sum = SubMath.summarize(SubMath.monthlyTotal(state.selected, state.prices));
    var text = '저는 구독료로 1년에 ' + won(sum.yearly) + ' 쓰고 있었어요 😱';
    try {
      if (window.AppsInToss && window.AppsInToss.share) {
        window.AppsInToss.share({ message: text });
        return;
      }
    } catch (e) {}
    if (navigator.share) { navigator.share({ text: text }).catch(function () {}); }
  };

  renderChips();
</script>
</body>
</html>
