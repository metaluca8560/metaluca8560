<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>배경 그라데이션 진단</title>
<!--
  임시 진단 페이지. 배경 영상이 이 기기에서 실제로 재생되는지,
  재생된다면 화면이 얼마나 변하는지를 숫자로 보여준다.
  원인이 확인되면 지운다.
-->
<style>
  body { margin:0; font:14px/1.6 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;
         background:#faf9f6; color:#221e33; padding:18px; }
  h1 { font-size:18px; margin:0 0 4px; }
  p.lead { color:#6f6a85; margin:0 0 16px; font-size:13px; }
  .stage { position:relative; width:100%; aspect-ratio:16/9; border-radius:12px;
           overflow:hidden; border:1px solid #e8e4f5; background:#faf9f6; }
  .stage video { width:100%; height:100%; object-fit:fill; display:block; }
  table { width:100%; border-collapse:collapse; margin-top:14px; font-size:13px; }
  td { padding:7px 6px; border-bottom:1px solid #e8e4f5; }
  td:first-child { color:#6f6a85; width:44%; }
  b { font-variant-numeric:tabular-nums; }
  .ok { color:#15803d; font-weight:700; }
  .bad { color:#b91c1c; font-weight:700; }
  .ctl { margin-top:18px; padding:14px; border:1px solid #e8e4f5; border-radius:12px; background:#fff; }
  .ctl label { display:block; font-weight:700; margin-bottom:8px; }
  input[type=range] { width:100%; }
  .val { font-size:22px; font-weight:900; color:#7c3aed; }
</style>
</head>
<body>
<h1>배경 그라데이션 진단</h1>
<p class="lead">사이트 배경과 똑같은 영상입니다. 아래 숫자로 재생 여부와 변화량을 알 수 있습니다.</p>

<div class="stage">
  <video id="v" autoplay muted loop playsinline preload="auto" poster="hero-poster.jpg?v=4">
    <source src="hero-loop.webm?v=4" type="video/webm" />
    <source src="hero-loop.mp4?v=4" type="video/mp4" />
  </video>
</div>

<table>
  <tr><td>재생 상태</td><td id="state">—</td></tr>
  <tr><td>재생 위치</td><td><b id="time">—</b></td></tr>
  <tr><td>고른 파일</td><td id="src">—</td></tr>
  <tr><td>해상도</td><td><b id="size">—</b></td></tr>
  <tr><td>동작 축소 설정</td><td id="rm">—</td></tr>
  <tr><td>3초 간격 화면 변화량</td><td><b id="delta">측정 중…</b></td></tr>
</table>

<div class="ctl">
  <label for="boost">색을 얼마나 진하게 하면 움직임이 보이나요?</label>
  <input type="range" id="boost" min="1" max="4" step="0.25" value="1" />
  <div>현재 강도 <span class="val" id="boostVal">1.0배</span></div>
  <p class="lead" style="margin:8px 0 0">
    슬라이더를 오른쪽으로 밀면서, <b>움직임이 눈에 보이기 시작하는 지점</b>의 숫자를 알려주세요.
    그 값으로 영상을 다시 뽑겠습니다. 1.0배에서 이미 보이면 그대로 두면 됩니다.
  </p>
</div>

<script>
var v = document.getElementById('v');
var $ = function (id) { return document.getElementById(id); };

setInterval(function () {
  $('state').innerHTML = v.paused
    ? '<span class="bad">멈춤 — 재생이 막혔습니다</span>'
    : '<span class="ok">재생 중</span>';
  $('time').textContent = v.currentTime.toFixed(2) + ' 초';
  $('src').textContent = v.currentSrc ? v.currentSrc.split('/').pop() : '못 고름';
  $('size').textContent = v.videoWidth ? v.videoWidth + ' × ' + v.videoHeight : '—';
  $('rm').textContent = matchMedia('(prefers-reduced-motion: reduce)').matches ? '켜짐' : '꺼짐';
}, 250);

// 3초 간격으로 두 프레임을 캔버스에 그려 픽셀 차이를 잰다
var c = document.createElement('canvas');
var ctx = c.getContext('2d', { willReadFrequently: true });
var prev = null;
function grab() {
  if (!v.videoWidth) return;
  c.width = 96; c.height = 54;
  ctx.drawImage(v, 0, 0, 96, 54);
  var cur = ctx.getImageData(0, 0, 96, 54).data;
  if (prev) {
    var mx = 0, tot = 0, n = 0;
    for (var i = 0; i < cur.length; i += 4) {
      var d = Math.max(Math.abs(cur[i]-prev[i]), Math.abs(cur[i+1]-prev[i+1]), Math.abs(cur[i+2]-prev[i+2]));
      if (d > mx) mx = d;
      tot += d; n++;
    }
    $('delta').innerHTML = (mx >= 10)
      ? '<span class="ok">최대 ' + mx + ' / 평균 ' + (tot/n).toFixed(1) + ' — 영상은 움직이고 있습니다</span>'
      : '<span class="bad">최대 ' + mx + ' / 평균 ' + (tot/n).toFixed(1) + ' — 거의 안 변합니다</span>';
  }
  prev = cur;
}
setInterval(grab, 3000);
setTimeout(grab, 900);

var boost = $('boost');
boost.addEventListener('input', function () {
  var n = Number(boost.value);
  $('boostVal').textContent = n.toFixed(1) + '배';
  // 채도와 대비를 함께 올려야 옅은 그라데이션의 움직임이 드러난다
  v.style.filter = n === 1 ? '' : 'saturate(' + n + ') contrast(' + (1 + (n - 1) * 0.25) + ')';
});
</script>
</body>
</html>
