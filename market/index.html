<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>동네 장날 — 우리 동네 전통시장 길잡이</title>
  <meta name="description" content="우리 동네 전통시장 찾기. 다음 장날(5일장) 자동 계산, 시장의 주무기(특산물·먹거리), 교통·길찾기까지 한눈에." />
  <meta property="og:title" content="동네 장날 — 전통시장 길잡이" />
  <meta property="og:description" content="다음 장날 언제? 이 시장 주무기는? 가는 길은? 한 번에 확인하세요." />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fastly.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://fastly.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="topbar">
    <div class="wrap topbar-in">
      <a href="#" class="logo" id="homeBtn">🛒 동네 <em>장날</em></a>
      <span class="topbar-sub">우리 동네 전통시장 길잡이</span>
    </div>
  </header>

  <div class="notice">
    <div class="wrap">✏️ 지금은 <strong>예시 데이터</strong>예요. <code>app.js</code>의 <code>MARKETS</code>에 우리 동네 시장을 넣으면 바로 내 앱이 됩니다.</div>
  </div>

  <main class="wrap main">

    <!-- 목록 화면 -->
    <section id="listView">
      <div class="hero">
        <h1>오늘, 어느 시장 가볼까요?</h1>
        <p>다음 장날·특산물·가는 길을 한눈에 알려드려요.</p>
      </div>
      <div class="filters" id="filters">
        <button class="filter is-on" data-f="all">전체</button>
        <button class="filter" data-f="5일장">5일장</button>
        <button class="filter" data-f="상설">상설시장</button>
      </div>
      <div id="marketList" class="market-list"></div>
    </section>

    <!-- 상세 화면 (선택 시) -->
    <section id="detailView" hidden></section>

  </main>

  <footer class="footer">
    <div class="wrap">
      <p><strong>동네 장날</strong> — 전통시장 길잡이 (MVP)</p>
      <p class="fine">시장 운영시간·교통 정보는 변동될 수 있어요. 방문 전 한 번 더 확인하세요. 온누리상품권 사용처는 시장마다 다릅니다.</p>
      <p class="fine">© <span id="year"></span> 동네 장날</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
