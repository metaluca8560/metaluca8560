<svg viewBox="0 0 1200 630" width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf6ec"/>
      <stop offset="100%" stop-color="#f5ddb8"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8722a"/>
      <stop offset="100%" stop-color="#c95c18"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#c95c18" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 장식 원 -->
  <circle cx="80"  cy="80"  r="140" fill="#e8722a" opacity="0.07"/>
  <circle cx="1140" cy="560" r="170" fill="#e8722a" opacity="0.07"/>
  <circle cx="1080" cy="90"  r="90"  fill="#c95c18" opacity="0.06"/>
  <circle cx="120"  cy="560" r="90"  fill="#c95c18" opacity="0.06"/>

  <!-- 상단 주황 바 -->
  <rect x="0" y="0" width="1200" height="12" fill="url(#bar)" rx="0"/>

  <!-- 중앙 카드 -->
  <rect x="60" y="55" width="1080" height="500" rx="28" fill="white" opacity="0.62" filter="url(#shadow)"/>

  <!-- 쇼핑카트 아이콘 -->
  <text x="600" y="210" font-size="108" text-anchor="middle" dominant-baseline="middle">🛒</text>

  <!-- 메인 타이틀 -->
  <text x="600" y="320" font-size="76" font-weight="900" text-anchor="middle"
        fill="#3b2200"
        font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','맑은 고딕',sans-serif"
        letter-spacing="-1">
    우리 시장 가자
  </text>

  <!-- 서브타이틀 -->
  <text x="600" y="400" font-size="34" font-weight="700" text-anchor="middle"
        fill="#e8722a"
        font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','맑은 고딕',sans-serif">
    전국 전통시장 · 시골 5일장 길잡이
  </text>

  <!-- 구분선 -->
  <rect x="520" y="428" width="160" height="3" rx="2" fill="#e8722a" opacity="0.35"/>

  <!-- 기능 설명 -->
  <text x="600" y="477" font-size="25" font-weight="600" text-anchor="middle"
        fill="#9a6b35"
        font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','맑은 고딕',sans-serif">
    장날 자동계산  ·  특산물  ·  제철 식재료  ·  AI 요리추천
  </text>

  <!-- 왼쪽 먹거리 이모지 -->
  <text x="140" y="480" font-size="36" text-anchor="middle">🥬</text>
  <text x="195" y="480" font-size="36" text-anchor="middle">🧄</text>
  <text x="250" y="480" font-size="36" text-anchor="middle">🐟</text>

  <!-- 오른쪽 먹거리 이모지 -->
  <text x="960" y="480" font-size="36" text-anchor="middle">🌽</text>
  <text x="1010" y="480" font-size="36" text-anchor="middle">🍠</text>
  <text x="1060" y="480" font-size="36" text-anchor="middle">🧅</text>

  <!-- URL -->
  <text x="600" y="545" font-size="21" text-anchor="middle"
        fill="#b07840" opacity="0.75"
        font-family="'Courier New',Consolas,monospace">
    metaluca8560.github.io/metaluca8560/market
  </text>

  <!-- 하단 주황 바 -->
  <rect x="0" y="618" width="1200" height="12" fill="url(#bar)"/>
</svg>
