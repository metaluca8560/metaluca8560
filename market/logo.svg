<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="우리 시장 가자 로고">
  <defs>
    <linearGradient id="mktGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.5" stop-color="#f97316"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <radialGradient id="mktCore" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#241408"/>
      <stop offset="1" stop-color="#100805"/>
    </radialGradient>
    <filter id="mktGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="48" cy="48" r="42" fill="url(#mktCore)"/>
  <circle cx="48" cy="48" r="42" fill="none" stroke="url(#mktGrad)" stroke-width="3.5" filter="url(#mktGlow)"/>
  <ellipse cx="48" cy="48" rx="41" ry="14" fill="none" stroke="url(#mktGrad)" stroke-width="2" opacity="0.5" transform="rotate(-24 48 48)"/>
  <!-- 장바구니 -->
  <g fill="none" stroke="url(#mktGrad)" stroke-linejoin="round" filter="url(#mktGlow)">
    <path d="M40 41 a8 10 0 0 1 16 0" stroke-width="5"/>
    <path d="M31 41 H65 L60 63 a5 5 0 0 1 -5 4 H41 a5 5 0 0 1 -5 -4 Z" stroke-width="6"/>
  </g>
  <circle cx="66" cy="30" r="4" fill="#fbbf24" filter="url(#mktGlow)"/>
</svg>
