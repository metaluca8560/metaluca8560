<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="AI 트렌드 다락방 로고">
  <defs>
    <linearGradient id="orbGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00ffa3"/>
      <stop offset="0.45" stop-color="#00c2ff"/>
      <stop offset="1" stop-color="#a24dff"/>
    </linearGradient>
    <radialGradient id="orbCore" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#0e1524"/>
      <stop offset="1" stop-color="#050810"/>
    </radialGradient>
    <filter id="orbGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- 오브 -->
  <circle cx="48" cy="48" r="42" fill="url(#orbCore)"/>
  <circle cx="48" cy="48" r="42" fill="none" stroke="url(#orbGrad)" stroke-width="3.5" filter="url(#orbGlow)"/>
  <!-- 궤도 링 -->
  <ellipse cx="48" cy="48" rx="41" ry="14" fill="none" stroke="url(#orbGrad)" stroke-width="2" opacity="0.5" transform="rotate(-24 48 48)"/>
  <!-- 위로 향하는 상승 셰브론 -->
  <g fill="none" stroke="url(#orbGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#orbGlow)">
    <path d="M30 64 L48 48 L66 64" opacity="0.45"/>
    <path d="M30 48 L48 32 L66 48"/>
  </g>
  <!-- 정점 스파클 -->
  <circle cx="48" cy="28" r="4" fill="#00ffa3" filter="url(#orbGlow)"/>
</svg>
