<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1120">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>💳 클로페이 — 언제 어디서나 결제</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>💳</text></svg>">
<style>
  :root {
    --bg: #0b1120;
    --card: #131c31;
    --card2: #1a2540;
    --accent: #60a5fa;
    --accent2: #34d399;
    --accent-dim: rgba(96, 165, 250, 0.15);
    --danger: #f87171;
    --warn: #fbbf24;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --border: rgba(148, 163, 184, 0.15);
    --radius: 20px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--text);
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(96, 165, 250, 0.10), transparent),
      radial-gradient(ellipse 60% 40% at 80% 110%, rgba(52, 211, 153, 0.07), transparent);
    -webkit-tap-highlight-color: transparent;
  }
  .app {
    max-width: 430px;
    margin: 0 auto;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: max(16px, env(safe-area-inset-top)) 16px calc(76px + env(safe-area-inset-bottom));
  }

  header { display: flex; align-items: center; justify-content: space-between; padding: 4px 4px 16px; }
  header .brand { display: flex; align-items: center; gap: 10px; }
  header .brand .logo {
    width: 36px; height: 36px; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center; font-size: 1.1rem;
  }
  header .brand h1 { font-size: 1.15rem; font-weight: 800; letter-spacing: -0.02em; }
  header .demo-badge {
    font-size: 0.7rem; font-weight: 700; color: var(--warn);
    border: 1px solid rgba(251, 191, 36, 0.4); border-radius: 999px; padding: 4px 10px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 14px;
  }

  /* 잔액 카드 */
  .balance-card {
    background: linear-gradient(135deg, rgba(96,165,250,0.18), rgba(52,211,153,0.12)), var(--card);
    position: relative; overflow: hidden;
  }
  .balance-card .label { color: var(--muted); font-size: 0.8rem; font-weight: 600; }
  .balance-card .amount { font-size: 2rem; font-weight: 800; letter-spacing: -0.03em; margin: 6px 0 16px; }
  .balance-card .amount small { font-size: 1.1rem; font-weight: 700; color: var(--muted); }
  .quick-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .quick-actions button {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 14px;
    padding: 12px 4px;
    font-size: 0.85rem; font-weight: 700;
    cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    transition: background 0.2s, transform 0.1s;
  }
  .quick-actions button:active { transform: scale(0.96); background: rgba(255,255,255,0.12); }
  .quick-actions button .ico { font-size: 1.3rem; }

  h2.section { font-size: 0.95rem; font-weight: 800; margin: 6px 4px 10px; display: flex; justify-content: space-between; align-items: center; }
  h2.section .more { font-size: 0.75rem; color: var(--muted); font-weight: 600; cursor: pointer; }

  /* 거래 목록 */
  .tx-list { display: flex; flex-direction: column; gap: 4px; }
  .tx {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 8px; border-radius: 14px;
  }
  .tx:active { background: rgba(255,255,255,0.04); }
  .tx .ico {
    width: 42px; height: 42px; border-radius: 50%;
    background: var(--card2); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0;
  }
  .tx .info { flex: 1; min-width: 0; }
  .tx .info .name { font-size: 0.9rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx .info .time { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
  .tx .amt { font-size: 0.92rem; font-weight: 800; white-space: nowrap; }
  .tx .amt.minus { color: var(--text); }
  .tx .amt.plus { color: var(--accent2); }
  .empty { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 28px 0; }

  /* 하단 탭 */
  nav.tabbar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 430px;
    background: rgba(11, 17, 32, 0.92);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid var(--border);
    display: grid; grid-template-columns: repeat(4, 1fr);
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
    z-index: 50;
  }
  nav.tabbar button {
    background: none; border: none; color: var(--muted); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 0.66rem; font-weight: 700; padding: 6px 0; border-radius: 12px;
    font-family: inherit;
  }
  nav.tabbar button .ico { font-size: 1.25rem; }
  nav.tabbar button.active { color: var(--accent); }

  .view { display: none; animation: fadein 0.22s ease; }
  .view.active { display: block; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* QR 결제 */
  .qr-box {
    display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 8px 0;
  }
  .qr-canvas-wrap {
    background: #fff; border-radius: 18px; padding: 14px;
    box-shadow: 0 0 0 6px var(--accent-dim);
  }
  .qr-canvas-wrap canvas, .qr-canvas-wrap img { display: block; width: 200px; height: 200px; }
  .qr-hint { color: var(--muted); font-size: 0.8rem; text-align: center; line-height: 1.5; }
  .qr-amount { font-size: 1.4rem; font-weight: 800; }
  .qr-timer { font-size: 0.75rem; color: var(--warn); font-weight: 700; }

  .btn {
    width: 100%; border: none; border-radius: 16px; padding: 15px;
    font-size: 0.95rem; font-weight: 800; cursor: pointer; font-family: inherit;
    transition: transform 0.1s, opacity 0.2s;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.4; }
  .btn.primary { background: linear-gradient(135deg, var(--accent), #3b82f6); color: #fff; }
  .btn.green { background: linear-gradient(135deg, var(--accent2), #10b981); color: #06281c; }
  .btn.ghost { background: var(--card2); color: var(--text); border: 1px solid var(--border); }
  .btn.danger { background: rgba(248,113,113,0.15); color: var(--danger); border: 1px solid rgba(248,113,113,0.35); }
  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* 금액 입력 & 키패드 */
  .amount-display { text-align: center; padding: 18px 0 6px; }
  .amount-display .val { font-size: 2.2rem; font-weight: 800; letter-spacing: -0.02em; min-height: 1.3em; }
  .amount-display .val.placeholder { color: var(--muted); font-weight: 600; font-size: 1.4rem; padding-top: 10px; }
  .amount-display .sub { color: var(--muted); font-size: 0.78rem; margin-top: 6px; min-height: 1.2em; }
  .chips { display: flex; gap: 8px; justify-content: center; margin: 10px 0 4px; flex-wrap: wrap; }
  .chips button {
    background: var(--card2); border: 1px solid var(--border); color: var(--text);
    border-radius: 999px; padding: 8px 14px; font-size: 0.78rem; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  .chips button:active { background: var(--accent-dim); }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
  .keypad button {
    background: none; border: none; color: var(--text);
    font-size: 1.35rem; font-weight: 700; padding: 16px 0; border-radius: 14px; cursor: pointer; font-family: inherit;
  }
  .keypad button:active { background: rgba(255,255,255,0.08); }

  /* 연락처 */
  .contacts { display: flex; gap: 12px; overflow-x: auto; padding: 4px 2px 10px; scrollbar-width: none; }
  .contacts::-webkit-scrollbar { display: none; }
  .contact {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    cursor: pointer; flex-shrink: 0; width: 64px;
  }
  .contact .avatar {
    width: 52px; height: 52px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem; font-weight: 800; color: #fff;
    border: 2px solid transparent;
  }
  .contact.selected .avatar { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-dim); }
  .contact .nm { font-size: 0.7rem; color: var(--muted); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 64px; }
  .contact.selected .nm { color: var(--accent); }

  /* 시트(모달) */
  .sheet-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 90;
    opacity: 0; pointer-events: none; transition: opacity 0.25s;
  }
  .sheet-backdrop.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 50%; bottom: 0; transform: translate(-50%, 105%);
    width: 100%; max-width: 430px; z-index: 100;
    background: var(--card); border: 1px solid var(--border); border-bottom: none;
    border-radius: 24px 24px 0 0; padding: 20px 20px calc(24px + env(safe-area-inset-bottom));
    transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
  }
  .sheet.open { transform: translate(-50%, 0); }
  .sheet .grip { width: 40px; height: 4px; border-radius: 2px; background: var(--border); margin: 0 auto 16px; }
  .sheet h3 { font-size: 1.05rem; font-weight: 800; margin-bottom: 4px; text-align: center; }
  .sheet .desc { color: var(--muted); font-size: 0.8rem; text-align: center; margin-bottom: 14px; }

  /* PIN */
  .pin-dots { display: flex; gap: 14px; justify-content: center; margin: 18px 0; }
  .pin-dots span { width: 14px; height: 14px; border-radius: 50%; background: var(--card2); border: 1px solid var(--border); }
  .pin-dots span.on { background: var(--accent); border-color: var(--accent); }
  .pin-dots.shake { animation: shake 0.4s; }
  @keyframes shake { 0%,100%{transform:none} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }

  /* 성공 화면 */
  .success-anim { text-align: center; padding: 10px 0 6px; }
  .success-anim .circle {
    width: 84px; height: 84px; margin: 0 auto 14px; border-radius: 50%;
    background: rgba(52,211,153,0.15); border: 2px solid var(--accent2);
    display: flex; align-items: center; justify-content: center; font-size: 2.4rem;
    animation: pop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes pop { from { transform: scale(0.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .success-anim .msg { font-size: 1.1rem; font-weight: 800; }
  .success-anim .amt { font-size: 1.6rem; font-weight: 800; color: var(--accent2); margin: 8px 0; }
  .success-anim .to { color: var(--muted); font-size: 0.82rem; margin-bottom: 16px; }

  /* 토스트 */
  #toast {
    position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom));
    transform: translate(-50%, 20px);
    background: var(--card2); border: 1px solid var(--border); color: var(--text);
    border-radius: 999px; padding: 10px 18px; font-size: 0.82rem; font-weight: 700;
    opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s; z-index: 200;
    white-space: nowrap; max-width: 90vw; overflow: hidden; text-overflow: ellipsis;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* 통계 바 */
  .stat-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .stat-row .cat { width: 74px; font-size: 0.78rem; color: var(--muted); font-weight: 700; flex-shrink: 0; }
  .stat-row .bar-wrap { flex: 1; height: 10px; background: var(--card2); border-radius: 5px; overflow: hidden; }
  .stat-row .bar { height: 100%; border-radius: 5px; background: linear-gradient(90deg, var(--accent), var(--accent2)); width: 0; transition: width 0.6s ease; }
  .stat-row .v { width: 84px; text-align: right; font-size: 0.75rem; font-weight: 700; flex-shrink: 0; }

  .settings-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 4px; border-bottom: 1px solid var(--border); font-size: 0.88rem; font-weight: 600; }
  .settings-row:last-child { border-bottom: none; }
  .settings-row .sub { color: var(--muted); font-size: 0.74rem; font-weight: 500; margin-top: 3px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo">💳</div>
      <h1>클로페이</h1>
    </div>
    <span class="demo-badge">DEMO</span>
  </header>

  <!-- ===== 홈 ===== -->
  <section class="view active" id="view-home">
    <div class="card balance-card">
      <div class="label">내 잔액</div>
      <div class="amount"><span id="balanceText">0</span><small> 원</small></div>
      <div class="quick-actions">
        <button onclick="openCharge()"><span class="ico">➕</span>충전</button>
        <button onclick="showTab('pay')"><span class="ico">🔳</span>QR결제</button>
        <button onclick="showTab('send')"><span class="ico">📤</span>송금</button>
      </div>
    </div>

    <h2 class="section">최근 거래 <span class="more" onclick="showTab('history')">전체보기 ›</span></h2>
    <div class="card" style="padding: 8px;">
      <div class="tx-list" id="recentTx"></div>
    </div>

    <h2 class="section">이번 달 지출</h2>
    <div class="card" id="statsCard"></div>
  </section>

  <!-- ===== QR 결제 ===== -->
  <section class="view" id="view-pay">
    <div class="card">
      <div class="qr-box">
        <div class="qr-amount" id="qrAmountText">금액을 입력하세요</div>
        <div class="qr-canvas-wrap"><div id="qrTarget"></div></div>
        <div class="qr-timer" id="qrTimer"></div>
        <div class="qr-hint">가맹점에 이 QR코드를 보여주세요.<br>코드는 60초마다 자동 갱신됩니다.</div>
      </div>
    </div>
    <div class="card">
      <div class="amount-display">
        <div class="val placeholder" id="payAmountDisplay">얼마를 결제할까요?</div>
        <div class="sub" id="payAmountKorean"></div>
      </div>
      <div class="chips">
        <button onclick="addPayAmount(1000)">+1천</button>
        <button onclick="addPayAmount(5000)">+5천</button>
        <button onclick="addPayAmount(10000)">+1만</button>
        <button onclick="addPayAmount(50000)">+5만</button>
        <button onclick="clearPayAmount()">지우기</button>
      </div>
      <div class="keypad" id="payKeypad"></div>
      <button class="btn green" style="margin-top: 12px;" id="simulatePayBtn" onclick="simulateStorePay()">🏪 가맹점 결제 시뮬레이션</button>
    </div>
  </section>

  <!-- ===== 송금 ===== -->
  <section class="view" id="view-send">
    <h2 class="section">받는 사람</h2>
    <div class="card" style="padding: 14px 14px 6px;">
      <div class="contacts" id="contactList"></div>
    </div>
    <div class="card">
      <div class="amount-display">
        <div class="val placeholder" id="sendAmountDisplay">얼마를 보낼까요?</div>
        <div class="sub" id="sendAmountKorean"></div>
      </div>
      <div class="chips">
        <button onclick="addSendAmount(10000)">+1만</button>
        <button onclick="addSendAmount(50000)">+5만</button>
        <button onclick="addSendAmount(100000)">+10만</button>
        <button onclick="clearSendAmount()">지우기</button>
      </div>
      <div class="keypad" id="sendKeypad"></div>
      <button class="btn primary" style="margin-top: 12px;" id="sendBtn" onclick="startSend()" disabled>송금하기</button>
    </div>
  </section>

  <!-- ===== 내역 ===== -->
  <section class="view" id="view-history">
    <h2 class="section">전체 거래내역</h2>
    <div class="card" style="padding: 8px;">
      <div class="tx-list" id="allTx"></div>
    </div>
    <h2 class="section">설정</h2>
    <div class="card" style="padding: 6px 16px;">
      <div class="settings-row">
        <div>결제 비밀번호<div class="sub">송금·결제 시 PIN 확인</div></div>
        <button class="btn ghost" style="width:auto; padding:8px 14px; font-size:0.78rem;" onclick="changePin()">변경</button>
      </div>
      <div class="settings-row">
        <div>데모 데이터 초기화<div class="sub">잔액·거래내역을 처음 상태로 되돌립니다</div></div>
        <button class="btn danger" style="width:auto; padding:8px 14px; font-size:0.78rem;" onclick="resetAll()">초기화</button>
      </div>
    </div>
    <p class="qr-hint" style="margin-top: 8px;">⚠️ 이 앱은 학습용 데모입니다. 실제 금전 거래가 이루어지지 않으며,<br>모든 데이터는 이 기기의 브라우저에만 저장됩니다.</p>
  </section>
</div>

<!-- 하단 탭 -->
<nav class="tabbar">
  <button data-tab="home" class="active" onclick="showTab('home')"><span class="ico">🏠</span>홈</button>
  <button data-tab="pay" onclick="showTab('pay')"><span class="ico">🔳</span>QR결제</button>
  <button data-tab="send" onclick="showTab('send')"><span class="ico">📤</span>송금</button>
  <button data-tab="history" onclick="showTab('history')"><span class="ico">📋</span>내역</button>
</nav>

<!-- 시트 -->
<div class="sheet-backdrop" id="sheetBackdrop" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"><div class="grip"></div><div id="sheetBody"></div></div>

<div id="toast"></div>

<script>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {

<script>
"use strict";

/* ================= 상태 ================= */
const LS_KEY = "clopay_v1";
const CONTACTS = [
  { id: "mom",   name: "엄마",   color: "#f472b6" },
  { id: "kim",   name: "김민준", color: "#60a5fa" },
  { id: "lee",   name: "이서연", color: "#34d399" },
  { id: "park",  name: "박지훈", color: "#fbbf24" },
  { id: "choi",  name: "최수아", color: "#a78bfa" },
  { id: "jung",  name: "정도윤", color: "#f87171" },
];
const CATEGORIES = ["🍜 식비", "☕ 카페", "🚕 교통", "🛒 쇼핑", "🎬 문화"];

const DEFAULT_STATE = () => ({
  balance: 50000,
  pin: null, // 최초 사용 시 설정
  tx: [
    { type: "charge", name: "첫 충전 보너스", amount: 50000, cat: null, at: Date.now() - 3600e3 },
  ],
});

let state = load();
function load() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return DEFAULT_STATE();
}
function save() { localStorage.setItem(LS_KEY, JSON.stringify(state)); }

/* ================= 유틸 ================= */
const fmt = (n) => n.toLocaleString("ko-KR");
function korean(n) {
  if (!n) return "";
  const units = [[100000000, "억"], [10000, "만"], [1000, "천"]];
  let rest = n, out = "";
  for (const [u, label] of units) {
    if (rest >= u) { out += Math.floor(rest / u) + label + " "; rest %= u; }
  }
  if (rest > 0) out += fmt(rest);
  return out.trim() + " 원";
}
function timeAgo(t) {
  const d = Date.now() - t;
  if (d < 60e3) return "방금 전";
  if (d < 3600e3) return Math.floor(d / 60e3) + "분 전";
  if (d < 86400e3) return Math.floor(d / 3600e3) + "시간 전";
  const dt = new Date(t);
  return `${dt.getMonth() + 1}월 ${dt.getDate()}일 ${String(dt.getHours()).padStart(2,"0")}:${String(dt.getMinutes()).padStart(2,"0")}`;
}
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 2200);
}
function vibrate(ms) { if (navigator.vibrate) navigator.vibrate(ms); }

/* ================= 탭 ================= */
function showTab(tab) {
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  document.getElementById("view-" + tab).classList.add("active");
  document.querySelectorAll("nav.tabbar button").forEach(b =>
    b.classList.toggle("active", b.dataset.tab === tab));
  if (tab === "pay") refreshQR();
  window.scrollTo({ top: 0 });
}

/* ================= 렌더링 ================= */
function txIcon(t) {
  if (t.type === "charge") return "➕";
  if (t.type === "send") return "📤";
  if (t.type === "receive") return "📥";
  return (t.cat || "💳").split(" ")[0];
}
function txRow(t) {
  const isPlus = t.type === "charge" || t.type === "receive";
  return `<div class="tx">
    <div class="ico">${txIcon(t)}</div>
    <div class="info">
      <div class="name">${t.name}</div>
      <div class="time">${timeAgo(t.at)}${t.cat ? " · " + t.cat.split(" ")[1] : ""}</div>
    </div>
    <div class="amt ${isPlus ? "plus" : "minus"}">${isPlus ? "+" : "−"}${fmt(t.amount)}원</div>
  </div>`;
}
function render() {
  document.getElementById("balanceText").textContent = fmt(state.balance);

  const sorted = [...state.tx].sort((a, b) => b.at - a.at);
  const recent = sorted.slice(0, 5);
  document.getElementById("recentTx").innerHTML =
    recent.length ? recent.map(txRow).join("") : `<div class="empty">아직 거래가 없어요</div>`;
  document.getElementById("allTx").innerHTML =
    sorted.length ? sorted.map(txRow).join("") : `<div class="empty">아직 거래가 없어요</div>`;

  // 이번 달 카테고리 통계
  const now = new Date();
  const monthTx = state.tx.filter(t => {
    const d = new Date(t.at);
    return t.type === "pay" && d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
  });
  const byCat = {};
  monthTx.forEach(t => { byCat[t.cat || "💳 기타"] = (byCat[t.cat || "💳 기타"] || 0) + t.amount; });
  const entries = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  const max = entries.length ? entries[0][1] : 1;
  document.getElementById("statsCard").innerHTML = entries.length
    ? entries.map(([cat, v]) => `<div class="stat-row">
        <div class="cat">${cat}</div>
        <div class="bar-wrap"><div class="bar" style="width:${Math.round(v / max * 100)}%"></div></div>
        <div class="v">${fmt(v)}원</div>
      </div>`).join("")
    : `<div class="empty">이번 달 결제 내역이 없어요</div>`;
}

/* ================= 키패드 ================= */
function buildKeypad(el, onKey) {
  const keys = ["1","2","3","4","5","6","7","8","9","00","0","⌫"];
  el.innerHTML = keys.map(k => `<button data-k="${k}">${k}</button>`).join("");
  el.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    vibrate(8);
    onKey(b.dataset.k);
  });
}
function applyKey(current, k, maxLen = 9) {
  if (k === "⌫") return current.slice(0, -1);
  if (current.length >= maxLen) return current;
  if (current === "" && (k === "0" || k === "00")) return current;
  return current + k;
}

/* ================= QR 결제 ================= */
let payAmountStr = "";
let qrTimerId = null, qrSecondsLeft = 60;

function updatePayDisplay() {
  const n = parseInt(payAmountStr || "0", 10);
  const disp = document.getElementById("payAmountDisplay");
  if (n > 0) {
    disp.textContent = fmt(n) + " 원";
    disp.classList.remove("placeholder");
  } else {
    disp.textContent = "얼마를 결제할까요?";
    disp.classList.add("placeholder");
  }
  document.getElementById("payAmountKorean").textContent = n > 0 ? korean(n) : "";
  document.getElementById("qrAmountText").textContent = n > 0 ? fmt(n) + " 원" : "금액을 입력하세요";
  document.getElementById("simulatePayBtn").disabled = !(n > 0 && n <= state.balance);
  refreshQR();
}
function addPayAmount(v) {
  payAmountStr = String(parseInt(payAmountStr || "0", 10) + v);
  vibrate(8); updatePayDisplay();
}
function clearPayAmount() { payAmountStr = ""; vibrate(8); updatePayDisplay(); }

function refreshQR() {
  const target = document.getElementById("qrTarget");
  const n = parseInt(payAmountStr || "0", 10);
  const payload = JSON.stringify({
    app: "clopay-demo", v: 1,
    token: Math.random().toString(36).slice(2, 10).toUpperCase(),
    amount: n || null, ts: Date.now(),
  });
  target.innerHTML = "";
  try {
    const qr = qrcode(0, "M"); // 타입 자동, 오류복원 레벨 M
    qr.addData(payload);
    qr.make();
    target.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0 });
    const svg = target.querySelector("svg");
    svg.setAttribute("width", "200");
    svg.setAttribute("height", "200");
  } catch (e) {
    fallbackQR(target);
  }
  // 60초 갱신 타이머
  qrSecondsLeft = 60;
  clearInterval(qrTimerId);
  qrTimerId = setInterval(() => {
    qrSecondsLeft--;
    if (qrSecondsLeft <= 0) { refreshQR(); return; }
    const t = document.getElementById("qrTimer");
    if (t) t.textContent = `🔄 ${qrSecondsLeft}초 후 갱신`;
  }, 1000);
  const t = document.getElementById("qrTimer");
  if (t) t.textContent = "🔄 60초 후 갱신";
}
function fallbackQR(target) {
  // 오프라인 등으로 QR 라이브러리를 못 불러온 경우: 안내 표시
  target.innerHTML = `<div style="width:200px;height:200px;display:flex;align-items:center;justify-content:center;
    text-align:center;color:#334155;font-size:0.8rem;font-weight:700;line-height:1.5;">QR 생성 모듈을<br>불러오지 못했어요<br><br>(네트워크 확인 후 새로고침)</div>`;
}

function simulateStorePay() {
  const n = parseInt(payAmountStr || "0", 10);
  if (n <= 0) return toast("금액을 먼저 입력해 주세요");
  if (n > state.balance) return toast("잔액이 부족해요");
  const stores = ["GS25 강남점", "스타벅스 역삼점", "김밥천국", "올리브영", "CGV 용산", "교보문고", "버거킹", "다이소"];
  const store = stores[Math.floor(Math.random() * stores.length)];
  const cat = CATEGORIES[Math.floor(Math.random() * CATEGORIES.length)];
  requirePin(() => {
    state.balance -= n;
    state.tx.push({ type: "pay", name: store, amount: n, cat, at: Date.now() });
    save(); render();
    payAmountStr = ""; updatePayDisplay();
    openSuccess("결제 완료!", n, store);
    vibrate([30, 50, 30]);
  });
}

/* ================= 송금 ================= */
let sendAmountStr = "";
let selectedContact = null;

function renderContacts() {
  document.getElementById("contactList").innerHTML = CONTACTS.map(c => `
    <div class="contact ${selectedContact === c.id ? "selected" : ""}" onclick="selectContact('${c.id}')">
      <div class="avatar" style="background:${c.color}">${c.name[0]}</div>
      <div class="nm">${c.name}</div>
    </div>`).join("");
}
function selectContact(id) {
  selectedContact = selectedContact === id ? null : id;
  vibrate(8); renderContacts(); updateSendDisplay();
}
function updateSendDisplay() {
  const n = parseInt(sendAmountStr || "0", 10);
  const disp = document.getElementById("sendAmountDisplay");
  if (n > 0) {
    disp.textContent = fmt(n) + " 원";
    disp.classList.remove("placeholder");
  } else {
    disp.textContent = "얼마를 보낼까요?";
    disp.classList.add("placeholder");
  }
  const sub = document.getElementById("sendAmountKorean");
  if (n > state.balance) { sub.textContent = "잔액이 부족해요 (보유 " + fmt(state.balance) + "원)"; sub.style.color = "var(--danger)"; }
  else { sub.textContent = n > 0 ? korean(n) : ""; sub.style.color = ""; }
  document.getElementById("sendBtn").disabled = !(n > 0 && n <= state.balance && selectedContact);
}
function addSendAmount(v) {
  sendAmountStr = String(parseInt(sendAmountStr || "0", 10) + v);
  vibrate(8); updateSendDisplay();
}
function clearSendAmount() { sendAmountStr = ""; vibrate(8); updateSendDisplay(); }

function startSend() {
  const n = parseInt(sendAmountStr || "0", 10);
  const c = CONTACTS.find(x => x.id === selectedContact);
  if (!c || n <= 0 || n > state.balance) return;
  requirePin(() => {
    state.balance -= n;
    state.tx.push({ type: "send", name: c.name + "님에게 송금", amount: n, cat: null, at: Date.now() });
    save(); render();
    sendAmountStr = ""; selectedContact = null;
    renderContacts(); updateSendDisplay();
    openSuccess("송금 완료!", n, c.name + "님에게 보냈어요");
    vibrate([30, 50, 30]);
  });
}

/* ================= 충전 ================= */
function openCharge() {
  openSheet(`
    <h3>충전하기</h3>
    <p class="desc">💳 카드·간편결제로 충전 (토스페이먼츠 결제창)</p>
    <div class="btn-row" style="margin-bottom:10px;">
      <button class="btn primary" onclick="goCheckout(10000)">1만원 충전</button>
      <button class="btn primary" onclick="goCheckout(30000)">3만원 충전</button>
    </div>
    <div class="btn-row" style="margin-bottom:18px;">
      <button class="btn primary" onclick="goCheckout(50000)">5만원 충전</button>
      <button class="btn primary" onclick="goCheckout(100000)">10만원 충전</button>
    </div>
    <p class="desc" style="margin-bottom:10px;">또는 결제 없이 데모 충전</p>
    <div class="btn-row">
      <button class="btn ghost" onclick="doCharge(10000)">+ 1만원 (데모)</button>
      <button class="btn ghost" onclick="doCharge(50000)">+ 5만원 (데모)</button>
    </div>`);
}
function goCheckout(n) {
  location.href = "checkout.html?amount=" + n;
}
function doCharge(n) {
  state.balance += n;
  state.tx.push({ type: "charge", name: "지갑 충전", amount: n, cat: null, at: Date.now() });
  save(); render(); closeSheet();
  toast("💰 " + fmt(n) + "원이 충전되었어요");
  vibrate(20);
}

/* ================= PIN ================= */
let pinBuffer = "", pinCallback = null, pinStage = null, pinFirstEntry = "";

function requirePin(cb) {
  pinCallback = cb;
  pinBuffer = "";
  if (!state.pin) { pinStage = "setup1"; pinFirstEntry = ""; }
  else pinStage = "verify";
  renderPinSheet();
}
function changePin() {
  pinCallback = () => { pinStage = "setup1"; pinFirstEntry = ""; pinBuffer = ""; renderPinSheet(); };
  pinBuffer = "";
  if (!state.pin) { pinStage = "setup1"; pinFirstEntry = ""; renderPinSheet(); }
  else { pinStage = "verify"; renderPinSheet(); }
}
function pinTitle() {
  if (pinStage === "setup1") return ["결제 비밀번호 설정", "사용할 4자리 숫자를 입력하세요"];
  if (pinStage === "setup2") return ["한 번 더 입력", "확인을 위해 다시 입력해 주세요"];
  return ["비밀번호 확인", "결제 비밀번호 4자리를 입력하세요"];
}
function renderPinSheet() {
  const [title, desc] = pinTitle();
  openSheet(`
    <h3>${title}</h3>
    <p class="desc">${desc}</p>
    <div class="pin-dots" id="pinDots">${[0,1,2,3].map(i =>
      `<span class="${i < pinBuffer.length ? "on" : ""}"></span>`).join("")}</div>
    <div class="keypad" id="pinKeypad"></div>`);
  buildKeypad(document.getElementById("pinKeypad"), onPinKey);
}
function onPinKey(k) {
  if (k === "00") return;
  if (k === "⌫") pinBuffer = pinBuffer.slice(0, -1);
  else if (pinBuffer.length < 4) pinBuffer += k;
  const dots = document.getElementById("pinDots");
  dots.querySelectorAll("span").forEach((s, i) => s.classList.toggle("on", i < pinBuffer.length));
  if (pinBuffer.length === 4) setTimeout(handlePinComplete, 120);
}
function handlePinComplete() {
  if (pinStage === "setup1") {
    pinFirstEntry = pinBuffer; pinBuffer = ""; pinStage = "setup2";
    renderPinSheet();
  } else if (pinStage === "setup2") {
    if (pinBuffer === pinFirstEntry) {
      state.pin = pinBuffer; save();
      const cb = pinCallback; // closeSheet()가 pinCallback을 비우므로 먼저 보관
      closeSheet(); toast("🔒 비밀번호가 설정되었어요");
      if (cb) setTimeout(cb, 250);
    } else {
      shakePin(); pinBuffer = ""; pinStage = "setup1"; pinFirstEntry = "";
      setTimeout(renderPinSheet, 350);
      toast("비밀번호가 달라요. 처음부터 다시 설정해 주세요");
    }
  } else { // verify
    if (pinBuffer === state.pin) {
      const cb = pinCallback; // closeSheet()가 pinCallback을 비우므로 먼저 보관
      closeSheet();
      if (cb) setTimeout(cb, 250);
    } else {
      shakePin(); pinBuffer = "";
      vibrate([40, 40, 40]);
      setTimeout(renderPinSheet, 350);
      toast("비밀번호가 틀렸어요");
    }
  }
}
function shakePin() {
  const dots = document.getElementById("pinDots");
  if (dots) { dots.classList.add("shake"); }
}

/* ================= 성공 시트 ================= */
function openSuccess(msg, amount, to) {
  openSheet(`
    <div class="success-anim">
      <div class="circle">✅</div>
      <div class="msg">${msg}</div>
      <div class="amt">${fmt(amount)}원</div>
      <div class="to">${to}</div>
      <button class="btn primary" onclick="closeSheet()">확인</button>
    </div>`);
}

/* ================= 시트 ================= */
function openSheet(html) {
  document.getElementById("sheetBody").innerHTML = html;
  document.getElementById("sheet").classList.add("open");
  document.getElementById("sheetBackdrop").classList.add("open");
}
function closeSheet() {
  document.getElementById("sheet").classList.remove("open");
  document.getElementById("sheetBackdrop").classList.remove("open");
  pinCallback = null;
}

/* ================= 초기화 ================= */
function resetAll() {
  if (!confirm("잔액과 거래내역이 모두 초기화됩니다. 계속할까요?")) return;
  state = DEFAULT_STATE(); save();
  payAmountStr = ""; sendAmountStr = ""; selectedContact = null;
  render(); renderContacts(); updatePayDisplay(); updateSendDisplay();
  toast("데모 데이터가 초기화되었어요");
}

/* ================= 부트스트랩 ================= */
buildKeypad(document.getElementById("payKeypad"), (k) => {
  payAmountStr = applyKey(payAmountStr, k, 8);
  updatePayDisplay();
});
buildKeypad(document.getElementById("sendKeypad"), (k) => {
  sendAmountStr = applyKey(sendAmountStr, k, 8);
  updateSendDisplay();
});
renderContacts();
render();
updatePayDisplay();
updateSendDisplay();
</script>
