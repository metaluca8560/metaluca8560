<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>냥이봇 사랑방</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Gaegu:wght@400;700&display=swap">
<style>
/* Layout: one lamp-lit room as the stage, everything you can do sits on a quiet panel beneath it */
:root{
  --ink:#1c1826;        /* page ground, the dark around the room */
  --panel:#262131;      /* control surfaces */
  --line:#3a3348;       /* hairlines */
  --cream:#f3ead8;      /* main text */
  --muted:#b3a9bd;      /* secondary text */
  --amber:#f2b65e;      /* lamp light, the one accent */
  --teal:#58bfb2;       /* progress, 루릭's eye colour */
  --rose:#e98a8f;       /* hearts, sulking */
  --display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --hand:"Gaegu","Gowun Dodum",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--ink);color:var(--cream)}
body{font-family:var(--body);font-size:15px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:8px 16px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,4.6vw,38px);line-height:1.1;margin:0;letter-spacing:.01em;text-wrap:balance}
h1 small{display:block;font-family:var(--body);font-size:14px;color:var(--muted);margin-top:6px;letter-spacing:0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--muted);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 3px rgba(88,191,178,.18)}

/* the room */
.scene{position:relative;width:100%;aspect-ratio:1000/620;max-width:100%;border-radius:14px;overflow:hidden;background:#3b3552;box-shadow:0 18px 50px -20px rgba(0,0,0,.7);user-select:none;-webkit-user-select:none}
.scene>svg.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.actor{position:absolute;transform:translate(-50%,-100%);transition:left 3.2s ease-in-out,top 3.2s ease-in-out,width .6s ease;line-height:0}
.actor svg{width:100%;height:auto;display:block;overflow:visible}
.bodywrap{display:block}
img.char{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 5px rgba(20,14,28,.55));-webkit-user-drag:none}
.cat-line .face.img{border-radius:50%;background-size:180% auto;background-position:50% 4%;background-repeat:no-repeat;background-color:#3a3348}
.actor.walking .bodywrap{animation:bob .45s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4%)}}
button.cat{all:unset;cursor:pointer;display:block;width:100%;-webkit-tap-highlight-color:transparent}
button.cat:focus-visible{outline:2px dashed var(--amber);outline-offset:4px;border-radius:8px}
.tail{transform-origin:70px 100px;animation:swish 3.6s ease-in-out infinite}
.loaf .tail{transform-origin:112px 72px;animation-duration:5s}
@keyframes swish{0%,100%{transform:rotate(0)}50%{transform:rotate(-12deg)}}
.eo{transform-box:fill-box;transform-origin:center;animation:blink 5.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.ec{display:none}
.content .ec,.slowblink .ec{display:inline}
.content .eo,.slowblink .eo{display:none}
.look{transition:transform 1.2s ease}
.gaze .look{transform:translate(-3px,-2.5px)}
.gaze .headg{transition:transform 1.2s ease}

.bubble{position:absolute;left:50%;bottom:calc(100% + 4px);transform:translateX(-50%);background:var(--cream);color:#2b2335;font-family:var(--hand);font-weight:700;font-size:clamp(12px,1.9vw,18px);line-height:1.2;padding:4px 10px;border-radius:12px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .3s;z-index:2}
.bubble.on{opacity:1}
.bubble::after{content:"";position:absolute;left:50%;top:100%;border:6px solid transparent;border-top-color:var(--cream);transform:translateX(-50%)}
.float{position:absolute;left:50%;bottom:80%;font-size:clamp(12px,2vw,20px);color:var(--rose);pointer-events:none;animation:up 1.8s ease-out forwards;line-height:1;font-family:var(--hand);font-weight:700}
.float.note{color:var(--amber)}
@keyframes up{from{transform:translate(-50%,0);opacity:1}to{transform:translate(calc(-50% + var(--dx,0px)),-60px);opacity:0}}
.pile{position:absolute;transform:translate(-50%,-100%);display:flex;align-items:end;gap:1px;pointer-events:none}
.pile i{display:block;width:clamp(3px,.55vw,6px);height:clamp(14px,2.4vw,24px);border-radius:2px;background:linear-gradient(#f6d27a 0 30%,#e9a64d 30%);transform:rotate(var(--r,0deg))}
.pile b{font-family:var(--hand);font-weight:700;font-size:clamp(10px,1.5vw,14px);color:var(--cream);margin-left:4px;line-height:1;text-shadow:0 1px 2px #0008}
.seatcta{position:absolute;left:50%;top:76%;transform:translate(-50%,-50%);z-index:900}
.btn{font:inherit;font-family:var(--body);cursor:pointer;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--cream);padding:8px 16px;font-size:14px;line-height:1.2;transition:background .2s,border-color .2s}
.btn:hover{border-color:var(--amber)}
.btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.btn.primary{background:var(--amber);color:#2b2335;border-color:var(--amber);font-weight:700}
.btn.primary:hover{background:#f6c57c}
.seatcta .btn{font-size:clamp(13px,2vw,16px);padding:10px 20px;box-shadow:0 8px 24px -8px #000a}
.mylabel{position:absolute;transform:translate(-50%,0);font-size:clamp(10px,1.4vw,13px);color:var(--muted);white-space:nowrap;pointer-events:none}

/* panel */
.panel{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:720px){.panel{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0;display:flex;flex-direction:column;gap:10px}
.card h2{font-family:var(--display);font-weight:400;font-size:18px;margin:0;letter-spacing:.01em}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lbl{font-size:12px;color:var(--muted);letter-spacing:.06em}
.cats{display:flex;flex-direction:column;gap:12px}
.cat-line{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center}
.cat-line .face{width:40px;height:40px}
.cat-line .meta{min-width:0}
.cat-line .top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.cat-line .nm{font-weight:700}
.cat-line .role{font-size:12px;color:var(--muted)}
.state{font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.state.work{color:#9fd4ff;border-color:#35506a}
.state.rest{color:#bfe8c9;border-color:#3d5a46}
.state.sulk{color:var(--rose);border-color:#6a3940}
.state.home{color:var(--amber);border-color:#6a5432}
.stage{font-size:13px;color:var(--cream)}
.bar{height:6px;background:#1c1826;border-radius:99px;overflow:hidden;margin-top:4px}
.bar span{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .5s}
.bar.gold span{background:var(--amber)}
.hint{font-size:12px;color:var(--muted)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-family:var(--hand);font-size:17px;line-height:1.3}
.log li{display:grid;grid-template-columns:44px 1fr;gap:8px;min-width:0}
.log time{font-family:var(--body);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.emo{font-size:18px;padding:6px 10px;line-height:1}
.emo[aria-pressed="true"]{border-color:var(--amber);background:#3a3045}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer}
.toggle input{accent-color:var(--amber);width:16px;height:16px}
.note{font-size:12px;color:var(--muted)}
.wide{grid-column:1/-1}
@media (prefers-reduced-motion:reduce){
  .actor{transition:none}
  .tail,.eo,.actor.walking .bodywrap,.twinkle{animation:none}
  .float{animation-duration:.01s}
}
.twinkle{animation:tw 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{0%,100%{opacity:.55;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}
.screenline{animation:type 1.6s steps(6) infinite}
@keyframes type{0%{opacity:.3}50%{opacity:1}100%{opacity:.3}}
</style>

<div class="wrap">
  <header>
    <h1>냥이봇 사랑방<small>집사 작업실에서 루릭·푸름이·창가 냥이와 같이 멍때리는 방</small></h1>
    <span class="chip" id="who"><span class="dot"></span><span id="whoText">혼자만의 시간</span></span>

  <div class="scene" id="scene">

        <circle r="40" fill="#f3ead8"/>

      <!-- shelf with books -->
      <rect x="610" y="232" width="190" height="8" rx="2" fill="#8a6a55"/>
      <g>
        <rect x="622" y="186" width="16" height="46" fill="#58bfb2"/>
        <rect x="640" y="194" width="13" height="38" fill="#e98a8f"/>
        <rect x="655" y="182" width="18" height="50" fill="#f2b65e"/>

      <rect y="430" width="1000" height="190" fill="#5a3f35"/>

        <line x1="180" y1="430" x2="180" y2="466"/><line x1="520" y1="430" x2="520" y2="466"/><line x1="860" y1="430" x2="860" y2="466"/>
        <line x1="90" y1="466" x2="90" y2="508"/><line x1="410" y1="466" x2="410" y2="508"/><line x1="740" y1="466" x2="740" y2="508"/>
        <line x1="260" y1="508" x2="260" y2="556"/><line x1="610" y1="508" x2="610" y2="556"/><line x1="950" y1="508" x2="950" y2="556"/>

      <ellipse cx="390" cy="452" rx="34" ry="7" fill="#2b2335" opacity=".5"/>

    <div id="actors"></div>

  <div class="panel">
    <section class="card" aria-labelledby="hMe">
      <h2 id="hMe">내 자리</h2>
      <div class="row">
        <button class="btn primary" id="seatBtn" type="button">방석에 앉기</button>
        <span class="hint" id="seatHint">가만히 있을수록 냥이봇들이 다가와요.</span>
      </div>
      <div>
        <div class="lbl">말 대신 표정 하나</div>
        <div class="row" id="emoRow" style="margin-top:6px"></div>
      </div>
      <div>
        <div class="lbl">나갈 때 츄르 하나 두고 가기</div>
        <div class="row" id="churuRow" style="margin-top:6px"></div>
        <p class="note" id="churuNote" style="margin:6px 0 0"></p>
      </div>
      <label class="toggle"><input type="checkbox" id="fast"> 미리보기: 시간 20배 빠르게</label>
    </section>

    <section class="card" aria-labelledby="hCats">
      <h2 id="hCats">친한 정도</h2>
      <div class="cats" id="catCards"></div>
    </section>

    <section class="card wide" aria-labelledby="hLog">
      <h2 id="hLog">작업실 로그</h2>
      <ul class="log" id="log"></ul>
    </section>

<script>
(() => {
"use strict";
/* ---------- the cats ----------

function starPath(cx, cy, r){
  let d = "";
  for (let i = 0; i < 10; i++){
    const a = -Math.PI/2 + i*Math.PI/5, rr = i % 2 ? r*.45 : r;
    d += (i ? "L" : "M") + (cx + Math.cos(a)*rr).toFixed(2) + " " + (cy + Math.sin(a)*rr).toFixed(2) + " ";
  }
  return d + "Z";
}

}

/* ---------- cat brains ---------- */
function stageOf(t){ let s = 0; for (let i = 0; i < STAGES.length; i++) if (t >= STAGES[i].at) s = i; return s; }
function lapOwner(){
  const ok = id => bots[id].mode === "rest" && Date.now() >= bots[id].sulkUntil && stageOf(intimacy[id]) === 3;
  if (!seated) return null;
  if (ok("ruric")) return "ruric";
  if (ok("pureum")) return "pureum";
  return null;
}
function target(id){
  const b = bots[id], now = Date.now();
  if (b.mode === "work") return { key:"desk", p:SPOT.desk[id], pose:"sit" };
  if (now < b.sulkUntil) return { key:"sulk", p:SPOT.sulk[id], pose:"loaf" };
  if (!seated){
    if (simTime >= b.roamUntil){ b.roamSpot = pick(SPOT.roam); b.roamPose = Math.random() < .5 ? "sit" : "loaf"; b.roamUntil = simTime + rand(25, 45); }
    return { key:"roam" + SPOT.roam.indexOf(b.roamSpot) + b.roamPose, p:b.roamSpot, pose:b.roamPose };
  }
  const st = stageOf(intimacy[id]);
  if (st === 3){
    if (lapOwner() === id) return { key:"lap", p:SPOT.lap, pose:"loaf", content:true };
    return { key:"s2", p:SPOT.s2[id], pose:"loaf", content:true };
  }
  if (st === 2) return { key:"s2", p:SPOT.s2[id], pose:"loaf", content:true };
  if (st === 1) return { key:"s1", p:SPOT.s1[id], pose:"sit" };
  return { key:"s0", p:SPOT.s0[id], pose:"sit" };
}
let lastStage = { ruric:-1, pureum:-1 };
function apply(id){
  const t = target(id), b = bots[id], el = A[id];
  if (b.key !== t.key){
    b.key = t.key;
    setPose(id, t.pose);
    place(el, t.p);
    if (!reduced){ el.classList.add("walking"); clearTimeout(el._w); el._w = setTimeout(() => el.classList.remove("walking"), 3200); }
  }
  el.classList.toggle("content", !!t.content);
  if (seated && b.mode === "rest"){
    const st = stageOf(intimacy[id]);
    if (st !== lastStage[id] && lastStage[id] !== -1 && st > lastStage[id]){
      say(el, ["힐끔", "킁킁…", "철퍼덕", "골골골♪"][st], 3500);
      log(`${CATS[id].name}: ${STAGES[st].name}`);
    }
    lastStage[id] = st;
  }
  if (t.key === "lap" && Math.random() < .03) floatUp(el, "♪", "note");
  else if (t.content && CATS[id].img && Math.random() < .012) floatUp(el, "골골", "note");
}

    let hint;
    if (!next) hint = "가장 친한 단계예요";
    else if (!seated) hint = "앉아 있는 동안만 친해져요";
    else hint = `다음 단계까지 ${fmt((next.at - intimacy[id]) / speed)}`;
    if (seated && b.mode === "work" && next) hint += " · 일 끝나면 와요";
    r.querySelector(".hint").textContent = hint;
  }
}

/* ---------- main loop ---------- */
let last = performance.now();
function tick(){
  const now = performance.now();
  let dt = Math.min((now - last) / 1000, 1); last = now;
  if (document.hidden) dt = 0;
  const sdt = dt * speed;
  simTime += sdt;
  if (seated) for (const id of BOTS) intimacy[id] += sdt;
  for (const id of BOTS){
    const b = bots[id];
    if (simTime >= b.until){
      if (b.mode === "rest"){ b.mode = "work"; b.until = simTime + rand(50, 80); b.nextLog = simTime + rand(10, 20); log(START_WORK[id]); }
      else { b.mode = "rest"; b.until = simTime + rand(240, 360); log(END_WORK[id]); }
    }
    if (b.mode === "work" && simTime >= b.nextLog){ log(`${CATS[id].name}: ${pick(WORK_LINES[id])}`); b.nextLog = simTime + rand(25, 40); }
    apply(id);
  }
  renderCards();
}
log("작업실 불이 켜졌어요. 푸름이는 일하는 중, 루릭은 뒹구는 중");
tick();
setInterval(tick, 250);
})();
</script>
