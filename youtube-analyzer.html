<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>유튜브 숏폼 분석기 — AI 트렌드 다락방</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <link rel="preconnect" href="https://fastly.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://fastly.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f; --surface: #13131a; --surface2: #1c1c28; --border: #2a2a3a;
      --primary: #ff0000; --primary-glow: rgba(255,0,0,0.15);
      --secondary: #ff9000; --secondary-glow: rgba(255,144,0,0.15);
      --text: #f0f0f5; --muted: #888; --radius: 14px;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Pretendard', -apple-system, sans-serif; min-height: 100vh; line-height: 1.6; }
    .header { padding: 20px 24px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); }
    .header a { text-decoration: none; color: var(--muted); font-size: 14px; }
    .header a:hover { color: var(--text); }
    .header-logo { width: 32px; height: 32px; }
    .header-title { font-size: 18px; font-weight: 700; background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header-sep { color: var(--border); margin: 0 4px; }
    .main { max-width: 900px; margin: 0 auto; padding: 40px 20px 80px; }
    .hero { text-align: center; margin-bottom: 48px; }
    .hero h1 { font-size: clamp(28px, 5vw, 44px); font-weight: 800; letter-spacing: -1px; line-height: 1.2; }
    .hero h1 span { background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .hero p { color: var(--muted); margin-top: 12px; font-size: 16px; }
    .yt-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,0,0,0.1); border: 1px solid rgba(255,0,0,0.3); border-radius: 20px; padding: 4px 14px; font-size: 13px; font-weight: 600; color: #ff6666; margin-top: 12px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; margin-bottom: 20px; }
    .card-title { font-size: 15px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 20px; }
    .field { margin-bottom: 18px; }
    label { display: block; font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
    label .hint { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 6px; }
    input, textarea, select { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; color: var(--text); font-family: inherit; font-size: 15px; outline: none; transition: border-color 0.2s; }
    input:focus, textarea:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
    textarea { resize: vertical; min-height: 90px; }
    select option { background: var(--surface2); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .metric-wrap { position: relative; }
    .metric-wrap input { padding-right: 40px; }
    .metric-unit { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 13px; pointer-events: none; }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 14px 28px; border: none; border-radius: 10px; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
    .btn-primary { background: linear-gradient(135deg, var(--primary), #ff4400); color: #fff; width: 100%; justify-content: center; font-size: 16px; }
    .btn-primary:hover:not(:disabled) { box-shadow: 0 8px 24px var(--primary-glow); transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); font-size: 13px; padding: 8px 14px; }
    .btn-secondary:hover { color: var(--text); border-color: var(--muted); }
    .loading { display: none; text-align: center; padding: 40px; }
    .loading.show { display: block; }
    .spinner { width: 48px; height: 48px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading p { color: var(--muted); font-size: 14px; }
    .result { display: none; }
    .result.show { display: block; }
    .score-bar { display: flex; align-items: center; gap: 20px; padding: 24px; background: var(--surface2); border-radius: 12px; margin-bottom: 24px; }
    .score-circle { width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 24px; font-weight: 900; border: 3px solid; }
    .score-circle.great { border-color: #4ade80; color: #4ade80; background: rgba(74,222,128,0.1); }
    .score-circle.good  { border-color: var(--secondary); color: var(--secondary); background: var(--secondary-glow); }
    .score-circle.ok    { border-color: #facc15; color: #facc15; background: rgba(250,204,21,0.1); }
    .score-circle.low   { border-color: var(--primary); color: var(--primary); background: var(--primary-glow); }
    .score-info h3 { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
    .score-info p  { color: var(--muted); font-size: 14px; }
    .section-label { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin: 28px 0 14px; display: flex; align-items: center; gap: 8px; }
    .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .insight-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .insight-item { background: var(--surface2); border-radius: 10px; padding: 16px; }
    .insight-item .label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
    .insight-item .value { font-size: 22px; font-weight: 800; }
    .insight-item .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .analysis-content { background: var(--surface2); border-radius: 12px; padding: 20px; font-size: 15px; line-height: 1.8; white-space: pre-wrap; }
    .analysis-content h3 { font-size: 15px; font-weight: 700; color: var(--secondary); margin: 18px 0 8px; }
    .analysis-content h3:first-child { margin-top: 0; }
    .analysis-content ul { padding-left: 20px; }
    .analysis-content li { margin-bottom: 6px; }
    .analysis-content strong { color: var(--text); }
    .action-row { display: flex; gap: 10px; margin-top: 20px; }
    @media (max-width: 600px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } .insight-grid { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
<header class="header">
  <img src="logo.svg" class="header-logo" alt="logo" />
  <a href="index.html">AI 트렌드 다락방</a>
  <span class="header-sep">›</span>
  <span class="header-title">유튜브 숏폼 분석기</span>
</header>
<main class="main">
  <div class="hero">
    <h1>유튜브 숏폼<br><span>AI 성과 분석기</span></h1>
    <p>영상 정보와 지표를 입력하면 AI가 콘텐츠 전략과 개선점을 분석해드려요</p>
    <div class="yt-badge">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814z"/><path d="M9.545 15.568V8.432L15.818 12l-6.273 3.568z" fill="#0a0a0f"/></svg>
      YouTube Shorts 전용 분석
    </div>
  </div>

  <div class="card">
    <div class="card-title">영상 정보 입력</div>
    <div class="field"><label>유튜브 숏폼 URL <span class="hint">선택사항</span></label><input type="url" id="videoUrl" placeholder="https://youtube.com/shorts/..." /></div>
    <div class="grid-2">
      <div class="field"><label>채널명</label><input type="text" id="creator" placeholder="채널 이름" /></div>
      <div class="field"><label>업로드 날짜 <span class="hint">선택사항</span></label><input type="date" id="uploadDate" /></div>
    </div>
    <div class="field"><label>영상 제목</label><input type="text" id="title" placeholder="영상 제목을 그대로 붙여넣으세요" /></div>
    <div class="field"><label>영상 설명 / 태그 <span class="hint">선택사항</span></label><textarea id="description" placeholder="영상 설명, 해시태그를 붙여넣으세요&#10;예) 오늘은 고양이의 하루를 담았어요 🐱 #고양이 #숏폼 #유튜브쇼츠"></textarea></div>
    <div class="grid-2">
      <div class="field"><label>카테고리</label><select id="category"><option value="">선택하세요</option><option>뷰티/패션</option><option>음식/요리</option><option>여행/라이프스타일</option><option>교육/정보</option><option>엔터테인먼트/유머</option><option>피트니스/헬스</option><option>비즈니스/마케팅</option><option>게임</option><option>반려동물</option><option>댄스/음악</option><option>브이로그</option><option>기타</option></select></div>
      <div class="field"><label>영상 길이</label><select id="duration"><option value="">선택하세요</option><option>15초 이하</option><option>15~30초</option><option>30~45초</option><option>45~60초</option></select></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">성과 지표</div>
    <p style="color:var(--muted);font-size:13px;margin-bottom:20px">유튜브 스튜디오에서 확인한 수치를 입력하세요</p>
    <div class="grid-3">
      <div class="field"><label>조회수</label><div class="metric-wrap"><input type="number" id="views" placeholder="0" min="0" /><span class="metric-unit">회</span></div></div>
      <div class="field"><label>좋아요</label><div class="metric-wrap"><input type="number" id="likes" placeholder="0" min="0" /><span class="metric-unit">개</span></div></div>
      <div class="field"><label>댓글</label><div class="metric-wrap"><input type="number" id="comments" placeholder="0" min="0" /><span class="metric-unit">개</span></div></div>
      <div class="field"><label>구독자 수</label><div class="metric-wrap"><input type="number" id="subscribers" placeholder="0" min="0" /><span class="metric-unit">명</span></div></div>
      <div class="field"><label>신규 구독자 <span class="hint">이 영상으로</span></label><div class="metric-wrap"><input type="number" id="newSubs" placeholder="0" min="0" /><span class="metric-unit">명</span></div></div>
      <div class="field"><label>평균 시청 지속시간 <span class="hint">선택사항</span></label><div class="metric-wrap"><input type="number" id="watchTime" placeholder="0" min="0" max="100" /><span class="metric-unit">%</span></div></div>
    </div>
    <div class="field"><label>추가 메모 <span class="hint">선택사항 — 업로드 시간, 썸네일 특이사항 등</span></label><textarea id="notes" placeholder="예) 저녁 6시 업로드, 썸네일에 얼굴 클로즈업 사용, 트렌드 사운드 적용" style="min-height:70px"></textarea></div>
  </div>

  <button class="btn btn-primary" id="analyzeBtn" onclick="analyze()">
    <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
    AI 분석 시작
  </button>

  <div class="loading" id="loading"><div class="spinner"></div><p>AI가 유튜브 숏폼을 분석 중이에요...</p></div>

  <div class="result card" id="result" style="margin-top:24px">
    <div id="resultContent"></div>
    <div class="action-row">
      <button class="btn btn-secondary" onclick="copyResult()">결과 복사</button>
      <button class="btn btn-secondary" onclick="resetForm()">새 분석</button>
    </div>
  </div>
</main>
<script>
  const PROXY_URL = '/api/proxy'
  // n8n 웹훅 주소는 서버(api/notify.js)의 N8N_WEBHOOK_URL 환경변수로 이동 — 클라이언트에 노출 금지
  const NOTIFY_URL = '/api/notify'

  function fmt(n) { if (!n) return '0'; if (n >= 1000000) return (n/1000000).toFixed(1)+'M'; if (n >= 1000) return (n/1000).toFixed(1)+'K'; return n.toString() }

  function calcEngagement(views, likes, comments) {
    if (!views || views === 0) return null
    return Math.min(((likes + comments * 2) / views) * 100, 100).toFixed(2)
  }

  function calcSubConversion(views, newSubs) {
    if (!views || views === 0 || !newSubs) return null
    return ((newSubs / views) * 100).toFixed(3)
  }

  function engLabel(rate) {
    if (rate >= 5) return {text:'매우 높음', cls:'great'}
    if (rate >= 2) return {text:'좋음', cls:'good'}
    if (rate >= 1) return {text:'보통', cls:'ok'}
    return {text:'개선 필요', cls:'low'}
  }

  function buildPrompt(data) {
    return `당신은 유튜브 숏폼(YouTube Shorts) 콘텐츠 전략 전문가입니다. 아래 영상 데이터를 분석하고 실행 가능한 인사이트를 제공해주세요.

## 영상 정보
- 채널명: ${data.creator||'미입력'}
- URL: ${data.url||'미입력'}
- 제목: ${data.title||'미입력'}
- 카테고리: ${data.category||'미입력'}
- 영상 길이: ${data.duration||'미입력'}
- 업로드 날짜: ${data.uploadDate||'미입력'}
- 설명/태그: ${data.description||'미입력'}
- 추가 메모: ${data.notes||'없음'}

## 성과 지표
- 조회수: ${fmt(data.views)}
- 좋아요: ${fmt(data.likes)}
- 댓글: ${fmt(data.comments)}
- 구독자 수: ${fmt(data.subscribers)}
- 신규 구독자: ${fmt(data.newSubs)}
- 평균 시청 지속시간: ${data.watchTime ? data.watchTime+'%' : '미입력'}
- 참여율: ${data.engRate !== null ? data.engRate+'%' : '계산 불가'}
- 구독자 전환율: ${data.subRate !== null ? data.subRate+'%' : '계산 불가'}

## 분석 요청
다음 항목을 한국어로 분석해주세요. 각 섹션 제목은 ### 마크다운 헤딩으로 작성해주세요.

### 📊 종합 성과 평가
이 영상의 전반적인 성과를 2~3문장으로 평가해주세요. 유튜브 숏폼 평균 대비 어느 수준인지 언급해주세요.

### 💡 콘텐츠 강점
이 영상이 잘한 점을 3가지 불릿으로 구체적으로 설명해주세요.

### ⚡ 개선 포인트
조회수, 시청 지속시간, 구독자 전환율 관점에서 개선할 수 있는 구체적인 액션 아이템 3가지를 제시해주세요.

### 🎯 제목 & SEO 전략
현재 제목을 평가하고, 클릭률을 높일 수 있는 개선된 제목 3가지를 제안해주세요. 유튜브 알고리즘 최적화 키워드도 추천해주세요.

### 🖼️ 썸네일 전략
높은 CTR을 위한 썸네일 구성 요소와 전략을 3가지 제안해주세요.

### 🔥 다음 영상 추천 전략
이 채널이 다음에 만들면 좋을 숏폼 콘텐츠 아이디어를 2~3가지 구체적으로 제안해주세요. 제목 후크, 첫 3초 전략, 구독 유도 포인트도 포함해주세요.

마지막에 **핵심 한 줄 요약**을 볼드로 작성해주세요.`
  }

  async function analyze() {
    const data = {
      url: document.getElementById('videoUrl').value,
      creator: document.getElementById('creator').value,
      uploadDate: document.getElementById('uploadDate').value,
      title: document.getElementById('title').value,
      description: document.getElementById('description').value,
      category: document.getElementById('category').value,
      duration: document.getElementById('duration').value,
      views: parseInt(document.getElementById('views').value)||0,
      likes: parseInt(document.getElementById('likes').value)||0,
      comments: parseInt(document.getElementById('comments').value)||0,
      subscribers: parseInt(document.getElementById('subscribers').value)||0,
      newSubs: parseInt(document.getElementById('newSubs').value)||0,
      watchTime: parseInt(document.getElementById('watchTime').value)||0,
      notes: document.getElementById('notes').value,
    }
    if (!data.title && !data.views) { alert('제목 또는 성과 지표를 최소 하나 입력해주세요!'); return }
    data.engRate = calcEngagement(data.views, data.likes, data.comments)
    data.subRate = calcSubConversion(data.views, data.newSubs)
    document.getElementById('analyzeBtn').disabled = true
    document.getElementById('loading').classList.add('show')
    document.getElementById('result').classList.remove('show')
    try {
      const res = await fetch(PROXY_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({prompt:buildPrompt(data)}) })
      const json = await res.json()
      if (json.error) throw new Error(json.error.message||json.error||'API 오류')
      const analysisText = json.content[0].text
      renderResult(data, analysisText)
      sendToN8n(data, analysisText)
    } catch(e) {
      alert('분석 중 오류가 발생했어요: '+e.message)
    } finally {
      document.getElementById('analyzeBtn').disabled = false
      document.getElementById('loading').classList.remove('show')
    }
  }

  function renderResult(data, text) {
    const engRate = data.engRate
    const engInfo = engRate !== null ? engLabel(parseFloat(engRate)) : null
    let html = ''
    if (engRate !== null) {
      html += `<div class="score-bar"><div class="score-circle ${engInfo.cls}">${engRate}%</div><div class="score-info"><h3>참여율 ${engInfo.text}</h3><p>조회수 대비 좋아요·댓글 비율</p></div></div>`
    }
    if (data.views > 0) {
      html += `<div class="insight-grid">
        <div class="insight-item"><div class="label">조회수</div><div class="value">${fmt(data.views)}</div><div class="sub">총 노출</div></div>
        <div class="insight-item"><div class="label">좋아요율</div><div class="value">${data.views?((data.likes/data.views)*100).toFixed(1)+'%':'–'}</div><div class="sub">${fmt(data.likes)}개</div></div>
        <div class="insight-item"><div class="label">구독자 전환율</div><div class="value">${data.subRate!==null?data.subRate+'%':'–'}</div><div class="sub">신규 ${fmt(data.newSubs)}명</div></div>
        <div class="insight-item"><div class="label">시청 지속시간</div><div class="value">${data.watchTime?data.watchTime+'%':'–'}</div><div class="sub">평균 완주율</div></div>
      </div>`
    }
    html += `<div class="section-label">AI 분석 리포트</div><div class="analysis-content" id="analysisText">${renderMarkdown(text)}</div>`
    document.getElementById('resultContent').innerHTML = html
    document.getElementById('result').classList.add('show')
    document.getElementById('result').scrollIntoView({behavior:'smooth',block:'start'})
  }

  function renderMarkdown(text) {
    return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/### (.+)/g,'<h3>$1</h3>').replace(/## (.+)/g,'<h3>$1</h3>')
      .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
      .replace(/^- (.+)/gm,'<li>$1</li>').replace(/(<li>.*<\/li>\n?)+/g,m=>`<ul>${m}</ul>`)
      .replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>')
  }

  async function sendToN8n(data, analysis) {
    try {
      await fetch(NOTIFY_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          title: data.title || '제목 없음',
          metrics: {
            views: data.views,
            engagement: data.engRate ? data.engRate + '%' : '–',
            likeRate: data.views ? ((data.likes/data.views)*100).toFixed(1)+'%' : '–',
            subConversion: data.subRate ? data.subRate+'%' : '–',
            watchTime: data.watchTime ? data.watchTime+'%' : '–',
            newSubs: data.newSubs || 0
          },
          analysis
        })
      })
    } catch(e) { console.log('n8n 알림 실패:', e.message) }
  }

  function copyResult() { const el=document.getElementById('analysisText'); if(!el) return; navigator.clipboard.writeText(el.innerText).then(()=>alert('분석 결과가 클립보드에 복사됐어요!')) }

  function resetForm() {
    document.getElementById('result').classList.remove('show')
    ;['videoUrl','creator','title','description','views','likes','comments','subscribers','newSubs','watchTime','notes'].forEach(id=>document.getElementById(id).value='')
    window.scrollTo({top:0,behavior:'smooth'})
  }
</script>
