<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="오늘 어디 아파? 로고">
  <defs>
    <linearGradient id="mediGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.55" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="mediCore" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#0e1a24"/>
      <stop offset="1" stop-color="#05100e"/>
    </radialGradient>
    <filter id="mediGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="48" cy="48" r="42" fill="url(#mediCore)"/>
  <circle cx="48" cy="48" r="42" fill="none" stroke="url(#mediGrad)" stroke-width="3.5" filter="url(#mediGlow)"/>
  <ellipse cx="48" cy="48" rx="41" ry="14" fill="none" stroke="url(#mediGrad)" stroke-width="2" opacity="0.5" transform="rotate(-24 48 48)"/>
  <!-- 메디컬 크로스 (단일 패스: 순수 수직/수평 선은 바운딩박스가 0이라 그라데이션이 안 그려짐) -->
  <path d="M48 33 V63 M33 48 H63" fill="none" stroke="url(#mediGrad)" stroke-width="10" stroke-linecap="round" filter="url(#mediGlow)"/>
  <circle cx="48" cy="27" r="4" fill="#34d399" filter="url(#mediGlow)"/>
</svg>
