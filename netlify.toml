[functions]
  directory = "netlify/functions"

# 분석기들이 호출하는 /api/proxy를 Netlify Function으로 연결
[[redirects]]
  from = "/api/proxy"
  to = "/.netlify/functions/proxy"
  status = 200

# 꿈분석기 프리미엄 결제 승인 (토스페이먼츠)
[[redirects]]
  from = "/api/confirm-payment"
  to = "/.netlify/functions/confirm-payment"
  status = 200

# n8n 웹훅 알림 중계 (웹훅 주소를 클라이언트에 노출하지 않기 위함)
[[redirects]]
  from = "/api/notify"
  to = "/.netlify/functions/notify"
  status = 200
