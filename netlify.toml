[functions]
  directory = "netlify/functions"

# 분석기들이 호출하는 /api/proxy를 Netlify Function으로 연결
[[redirects]]
  from = "/api/proxy"
  to = "/.netlify/functions/proxy"
  status = 200

# 꿈분석기 프리미엄 결제 승인 (토스페이먼츠)
[[redirects]]
  from = "/api/confirm-payment"
  to = "/.netlify/functions/confirm-payment"
  status = 200

# n8n 웹훅 알림 중계 (웹훅 주소를 클라이언트에 노출하지 않기 위함)
[[redirects]]
  from = "/api/notify"
  to = "/.netlify/functions/notify"
  status = 200

# auto-trader.html 실제 자동매매(Alpaca 페이퍼) 브로커 프록시
# API 키를 클라이언트에 노출하지 않기 위한 중계. 환경변수 ALPACA_KEY_ID / ALPACA_SECRET_KEY 필요.
[[redirects]]
  from = "/api/broker"
  to = "/.netlify/functions/broker"
  status = 200

# auto-trader.html 국내주식 자동매매(한국투자증권 KIS, 모의투자) 프록시
# 환경변수 KIS_APP_KEY / KIS_APP_SECRET / KIS_ACCOUNT 필요.
[[redirects]]
  from = "/api/kis"
  to = "/.netlify/functions/kis"
  status = 200

# auto-trader.html 업비트 코인 실매매 프록시 (⚠️ 실제 원화)
# 환경변수 UPBIT_ACCESS_KEY / UPBIT_SECRET_KEY 필요.
[[redirects]]
  from = "/api/upbit"
  to = "/.netlify/functions/upbit"
  status = 200
